<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chargement...</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --purple-accent: #6b21a8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1e1229;
                --text-color: #e2e8f0;
                --purple-accent: #c084fc;
            }
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }
        
        /* ✨ CSS MIS À JOUR POUR L'IMAGE PERSONNALISÉE */
        .logo-image {
            width: 80px;            /* Ajustez la largeur de votre icône ici */
            height: 80px;           /* Ajustez la hauteur de votre icône ici */
            object-fit: contain;
            margin-bottom: 24px;
            animation: pulse 1.8s infinite ease-in-out;
            -webkit-user-drag: none; /* Empêche le curseur de "glisser" l'image seule */
        }
        
        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 32px;
        }
        .progress-bar-container {
            width: 200px;
            height: 4px;
            background: rgba(128, 128, 128, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar-value {
            width: 100%;
            height: 100%;
            background-color: var(--purple-accent);
            border-radius: 2px;
            animation: indeterminate 1.5s infinite linear;
            transform-origin: 0% 50%;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; }
        }
        @keyframes indeterminate {
            0% { transform: translateX(-100%) scaleX(0.2); }
            50% { transform: translateX(0%) scaleX(0.5); }
            100% { transform: translateX(100%) scaleX(0.2); }
        }
    </style>
</head>
<body>
    <!-- ✨ ÉMOJI REMPLACÉ PAR VOTRE IMAGE PERSONNALISÉE -->
    <img src="app-logo.png" class="logo-image" alt="Logo de l'application">
    
    <h1>Hare Browser</h1>
    <div class="subtitle">Initialisation de la mosaïque d'onglets...</div>
    <div class="progress-bar-container">
        <div class="progress-bar-value"></div>
    </div>
</body>
</html>
