<style>

:root {
    /* Fonds */
    --bg-main: #f3f4f6;
    --bg-toolbar: #ffffff;
    --bg-secondary: #f9fafb;

    /* Boutons */
    --button-bg: #f3f4f6;
    --button-hover: #e5e7eb;
    --button-border: #d1d5db;

    /* Texte */
    --text-primary: #1f2937;
    --text-secondary: #374151;

    /* Bordures */
    --border-color: #e5e7eb;

    /* Splitters */
    --splitter-bg: #d1d5db;
    --splitter-hover: #9ca3af;
}

html.dark {
    /* Fonds */
    --bg-main: #252526;
    --bg-toolbar: #252526;
    --bg-secondary: #252526;

    /* Boutons */
    --button-bg: #2d2d30;
    --button-hover: #3f3f46;
    --button-border: #3c3c3c;

    /* Texte */
    --text-primary: #cfcfcf;
    --text-secondary: #cfcfcf;

    /* Bordures */
    --border-color: #3c3c3c;

    /* Splitters */
    --splitter-bg: #4b5563;
    --splitter-hover: #6b7280;
}

/* =====================================================
   APPLICATION
===================================================== */

html,
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background: var(--bg-main);

    display: flex;
    flex-direction: column;

    transition: background .2s ease;
}

/* =====================================================
   BARRE D'OUTILS
===================================================== */

#toolbar-buttons {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-toolbar);
    
    /* Supprimez ou commentez cette ligne : */
    /* border-bottom: 1px solid var(--border-color); */

    padding: 4px 8px;
    padding-right: 140px;
    box-sizing: border-box;
    z-index: 99999;
    -webkit-app-region: drag;
}

#toolbar-buttons button,
#toolbar-buttons div {
    -webkit-app-region: no-drag;
}

.toolbar-button:disabled {
    opacity: 0.4;
    cursor: default;
    pointer-events: none;
}

/* =====================================================
   BOUTONS
===================================================== */

#toolbar-buttons button {
    width: 28px;
    height: 24px;

    background: var(--button-bg) !important;
    color: var(--text-primary) !important;

    border: 1px solid var(--button-border) !important;
    border-radius: 4px;

    cursor: pointer;
    font-weight: bold;

    transition: all .2s ease;
}

#toolbar-buttons button:hover:not(:disabled) {
    background: var(--button-hover) !important;
}

#toolbar-buttons button:focus {
    outline: none;
    box-shadow: none;
}

#toolbar-buttons button:disabled {
    opacity: .4;

    background: var(--button-bg) !important;
    color: #6b7280 !important;

    cursor: not-allowed;
}

/* =====================================================
   BARRE D'URL
===================================================== */

#url-bar {
    height: 24px !important; /* Réduit de 28px à 24px */
    background: var(--bg-secondary);
    border-bottom: 1px solid #e5e7eb !important;
    border-top: 1px solid #e5e7eb !important;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    position: fixed;
    top: 38px;
    width: 100%;
    box-sizing: border-box;
}

.url-tab {
    padding: 0px 6px !important; /* Supprime le padding vertical (haut/bas) pour aplatir l'onglet */
    height: 20px !important;     /* Force une hauteur d'onglet de 20px pour rentrer dans les 24px */
}

.url-input {
    color: #111827;
   height: 18px !important;
    font-size: 11px !important; /* Optionnel : réduit légèrement la police si le texte est coupé */
}

.dark .url-input {
    color: #ffffff;
}

/* Style mis à jour pour la pastille incognito dans la barre d'adresse */
.incognito-badge {
    /* Couleurs par défaut pour le MODE CLAIR (Fond plus doux et lisible) */
    background: #f3e8ff; 
    color: #6b21a8;      
    border: 1px solid #d8b4fe;

    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 3px;
    margin-right: 6px;
    user-select: none;
    flex-shrink: 0;      
    display: flex;
    align-items: center;
    gap: 3px;
}

/* Surcharge automatique si le MODE SOMBRE est actif */
html.dark .incognito-badge {
    background: #4c1d95; 
    color: #c084fc;      
    border: 1px solid #6b21a8;
}

html.dark #url-bar {
    border-bottom: 1px solid #3c3c3c !important;
    border-top: 1px solid #3c3c3c !important;
}



.loading-spinner {
    display: inline-block;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   FAVORIS
===================================================== */

#bookmarks-bar {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-left: auto;

    height: 100%;
    padding: 0;

    background: transparent;
    border: none;

    flex-shrink: 0;
}

#bookmarks-list {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    max-width: 500px;
}

#clear-bookmarks-btn {
    width: 20px;
    height: 20px;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
}

.bookmarks-actions {
    display: flex;
    align-items: center;
    gap: 4px;
}


.bookmark-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px !important; /* Marge interne identique aux URLs */
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    border-radius: 6px !important; /* Même arrondi que vos onglets d'URL */
    cursor: pointer;
    transition: all .2s ease;
    
    /* Couleurs par défaut (Mode Clair) */
    background: #ffffff !important;
    border: 1px solid #d1d5db !important;
    color: #1f2937 !important;
}


.bookmark-item:hover {
    background: var(--button-hover) !important;
    color: #000000 !important;
}

html.dark .bookmark-item {
    background: #2d2d30 !important;
    border: 1px solid #3c3c3c !important;
    color: #cfcfcf !important;
}

html.dark .bookmark-item:hover {
    background: #3f3f46 !important;
    color: #ffffff !important;
}

#close-bookmarks-bar {
    color: #6b7280;

    font-size: 11px;
    font-weight: bold;

    padding: 2px 6px;

    border-radius: 4px;

    cursor: pointer;

    transition: all .2s ease;
}

#close-bookmarks-bar:hover {
    background: #991b1b;
    color: #fca5a5;
}

/* À insérer dans votre bloc <style> ou à modifier si existant */
#bookmarks-list {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important; /* Permet de passer à la ligne suivante si la barre est pleine */
    gap: 6px !important;       /* Espace horizontal entre chaque favori */
    align-items: center;
}

function refreshTabBorders() {
    const container = document.getElementById("url-bar");
    if (!container) return;

    const isDark = document.documentElement.classList.contains('dark');
    const tabs = container.children;
    for (let i = 0; i < tabs.length; i++) {
        const tabWrapper = tabs[i];
        const input = tabWrapper.querySelector("input");
        if (!input) continue;

        const panelId = input.id.replace("-url", "");

        if (activePanel && panelId === activePanel) {
            tabWrapper.style.borderColor = "#3b82f6";

            tabWrapper.style.background = isDark ? "#203a5d" : "#dbeafe";


        } else {
            
            tabWrapper.style.borderColor = isDark ? "#3c3c3c" : "#d1d5db";


            tabWrapper.style.background = isDark
                ? "#3a3a3f"
                : "#f3f4f6";

        }
    }
}

function getDisplayUrl(url) {
    try {
        const parsedUrl = new URL(url);
        
        // === CORRECTIF : Masque l'IP du serveur de recherche privé ===
        if (parsedUrl.hostname === "129.151.254.175") {
            // Option A : Affiche simplement "Recherche"
            // return "Recherche";
            
            // Option B (alternative) : Si vous voulez afficher "Recherche : le mot clé"
               const queryParams = new URLSearchParams(parsedUrl.search);
               return "Recherche : " + (queryParams.get('q') || "");
        }
        
        // Comportement normal pour les autres sites (ex: google.com, github.com)
        return parsedUrl.hostname.replace(/^www\./, "");
    } catch {
        return url || "";
    }
}

function attachUrlHandler(panelId) {
    const input = document.getElementById(panelId + "-url");
    if (!input) return;

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            window.api.navigate(panelId, e.target.value);
        }
    });
}

async function checkFavorisState() {
    if (typeof currentPanels === 'undefined' || !currentPanels) return;

    const favoris = await window.api.getFavoris?.() || [];
    
    currentPanels.forEach(panel => {
        const input = document.getElementById(`${panel.id}-url`);
        const starBtn = document.getElementById(`star-${panel.id}`);
        
        if (input && starBtn) {
            // Sécurité : Récupère l'URL brute associée au panneau
            const currentUrl = input.dataset.url || panel.realUrl || panel.url || "";
            
            // Comparaison propre des chaînes d'URLs
            const isFavori = favoris.some(f => f.url.trim() === currentUrl.trim());

            starBtn.title = isFavori ? "Retirer des favoris" : "Ajouter aux favoris";

function updateMaximizedTabDisplay(maximizedPanelId) {
    const container = document.getElementById("url-bar");
    if (!container) return;

    const tabs = container.children;

    for (const tab of tabs) {

        const input = tab.querySelector("input");
        if (!input) continue;

        const panelId = input.id.replace("-url", "");

        if (maximizedPanelId) {

            if (panelId === maximizedPanelId) {
                tab.style.display = "flex";
                tab.style.flex = "1";
            } else {
                tab.style.display = "none";
            }

        } else {

            tab.style.display = "flex";
            tab.style.flex = "1";
        }
    }
}

window.api.onZoomChanged((maximizedPanelId) => {

    currentMaximizedId = maximizedPanelId;

    const container = document.getElementById("url-bar");

});

function updateCloseButtonState() {
    const closeBtn = document.getElementById("close-panel");
    if (!closeBtn) return;

    const selectedPanel = currentMaximizedId || activePanel;

    if (!selectedPanel) {
        closeBtn.disabled = true;
        closeBtn.style.cursor = "not-allowed";
        closeBtn.title = "Aucun panneau sélectionné";
    } else {
        closeBtn.disabled = false;
        closeBtn.style.cursor = "pointer";
        closeBtn.title = "Fermer le panneau actif";
    }
}

function updateToolbarButtons(canGoBack, canGoForward) {
    const backBtn = document.getElementById("back-button");
    const forwardBtn = document.getElementById("forward-button");

    if (backBtn) {
        backBtn.disabled = !canGoBack;
        backBtn.style.opacity = canGoBack ? "1" : "0.4";
        backBtn.style.cursor = canGoBack ? "pointer" : "not-allowed";
    }
    if (forwardBtn) {
        forwardBtn.disabled = !canGoForward;
        forwardBtn.style.opacity = canGoForward ? "1" : "0.4";
        forwardBtn.style.cursor = canGoForward ? "pointer" : "not-allowed";

}

const historySidebar = document.getElementById("history-sidebar");
const historyContainer = document.getElementById("history-list-container");

// 1. Fonction pour ouvrir/fermer le volet
function toggleHistorySidebar() {
    if (!historySidebar) return;
    historySidebar.classList.toggle("open");

    if (historySidebar.classList.contains("open")) {
        renderHistory();
    }
}
async function renderHistory(historyList) {
    if (!window.api.getHistory) {
        console.error("L'API getHistory n'est pas définie dans preload.js");
        return;
    }

    if (!historyList) {
        historyList = await window.api.getHistory() || [];
    }
    
    historyContainer.innerHTML = "";
    
    if (historyList.length === 0) {
        historyContainer.innerHTML = '<span style="color: #6b7280; font-size: 11px; padding: 8px; display: block;">Aucun historique disponible.</span>';
        return;
    }
    
    historyList.forEach((item, index) => {
        // Conteneur principal de la ligne
        const div = document.createElement("div");
        div.className = "history-item";
        div.style.display = "flex";
        div.style.justify = "space-between";
        div.style.alignItems = "center";
        
        // Texte du lien
        const textSpan = document.createElement("span");
        textSpan.innerText = item.title || item.url;
        textSpan.title = `${item.title}\n${item.url}`;
        textSpan.style.overflow = "hidden";
        textSpan.style.textOverflow = "ellipsis";
        textSpan.style.flex = "1";
        
        textSpan.addEventListener("click", () => {
            if (activePanel) {
                window.api.navigate(activePanel, item.url);
                toggleHistorySidebar();
            }
        });
        
        // Bouton de suppression unique
        const deleteBtn = document.createElement("span");
        deleteBtn.innerHTML = "&#10006;"; // Code pour l'icône X
        deleteBtn.style.color = "#ef4444";
        deleteBtn.style.cursor = "pointer";
        deleteBtn.style.marginLeft = "8px";
        deleteBtn.style.padding = "2px 4px";
        deleteBtn.title = "Supprimer cet élément";
        
        deleteBtn.addEventListener("click", async (e) => {
            e.stopPropagation(); // Évite de déclencher le clic de navigation
            if (window.api.deleteHistoryItem) {
                const updated = await window.api.deleteHistoryItem(index);
                renderHistory(updated);
            }
        });
        
        div.appendChild(textSpan);
        div.appendChild(deleteBtn);
        historyContainer.appendChild(div);
    });
}
