<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="tailwind.css">
    <title>Tile Browser</title>
</head>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #f3f4f6; /* MODIFICATION : Gris clair par défaut au démarrage */
    display: flex;
    flex-direction: column;
}



/* DANS INDEX.HTML -> Modifiez le style existant de #active-panel-frame : */
#active-panel-frame {
    position: absolute;
    border: 2px solid #3b82f6;
    box-sizing: border-box;
    pointer-events: none; /* TRÈS IMPORTANT : permet de cliquer et voir à travers */
    z-index: 1;           /* MODIFICATION : On baisse l'index pour laisser passer les BrowserViews d'Electron */
    display: none;
}

/* ====== BARRE DE BOUTONS IMMERSIVE AVEC ZONE DE DRAG ACCESSIBLE ====== */
#toolbar-buttons {
    height: 38px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 4px;
    background: #f3f4f6; /* MODIFICATION : Fond clair */
    border-bottom: 1px solid #e5e7eb; /* MODIFICATION : Bordure claire */
    padding: 4px 8px;
    box-sizing: border-box;
    z-index: 99999 !important;
    -webkit-app-region: drag; 
    padding-right: 140px; 
}


bookmarks-bar {
    height: 28px;
    width: 100%;
    background: #f3f4f6; /* MODIFICATION : Fond clair */
    border-bottom: 1px solid #e5e7eb; /* MODIFICATION : Bordure claire */
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between; 
    padding: 0 8px;
    overflow: hidden;
}

/* ====== FIX : LA BARRE D'ADRESSE TECHNIQUE PAR DÉFAUT (MODE CLAIR) ====== */
#address-bar {
    background: #ffffff !important;   /* Fond blanc/clair */
    color: #1f2937 !important;        /* Texte gris foncé */
    border-bottom: 1px solid #e5e7eb !important;
}

/* Force l'input texte à l'intérieur à s'éclaircir aussi */
#address-bar input, 
#address-input {
    background: #f3f4f6 !important;
    color: #1f2937 !important;
    border: 1px solid #d1d5db !important;
}

/* ====== BASCULE EN MODE SOMBRE SUR CETTE BARRE ====== */
body.dark-ui #address-bar {
    background: #2d2d30 !important;   /* Retour au look sombre d'origine */
    color: #d4d4d4 !important;
    border-bottom: 1px solid #3c3c3c !important;
}

body.dark-ui #address-bar input,
body.dark-ui #address-input {
    background: #1e1e1e !important;
    color: #d4d4d4 !important;
    border: 1px solid #3c3c3c !important;
}



/* Force tous les composants internes de la barre à redevenir cliquables normalement */
#toolbar-buttons button, 
#toolbar-buttons div {
    -webkit-app-region: no-drag;
}

/* ====== DANS INDEX.HTML -> CHERCHEZ #url-bar (Vers la ligne 36) ====== */
#url-bar {
    height: 36px;
    width: 100%;
    background: #f3f4f6 !important; /* Force le fond clair dès le départ */
    border-bottom: 1px solid #e5e7eb !important;
    box-sizing: border-box;
    display: flex;
    gap: 8px;
    padding: 0 8px;
    align-items: center;
    position: fixed;
    top: 38px;       
    z-index: 50;
}


/* S'assurer que le conteneur de l'onglet aligne l'input et la croix horizontalement */
#url-bar > div {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
}


/* Style du panneau d'historique latéral */
#history-sidebar {
    position: fixed;
    top: 105px; /* Aligné sous votre barre de favoris */
    right: -320px; /* Caché par défaut à droite */
    width: 300px;
    bottom: 0;
    background: #1e1e1e;
    border-left: 1px solid #3c3c3c;
    box-shadow: -4px 0 10px rgba(0,0,0,0.5);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    transition: right 0.3s ease;
    padding: 12px;
    box-sizing: border-box;
}

#history-sidebar.open {
    right: 0; /* S'ouvre en glissant */
}

#history-list-container {
    flex: 1;
    overflow-y: auto;
    margin-top: 10px;
}

.history-item {
    padding: 6px 8px;
    border-bottom: 1px solid #2d2d30;
    cursor: pointer;
    font-size: 11px;
    color: #cfcfcf;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.history-item:hover {
    background: #2d2d30;
    color: #ffffff;
}


/* Jauge ultra-visible avec dégradé vif et lueur */
.download-progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 4px;
    background: linear-gradient(90deg, #f97316, #22c55e); 
    box-shadow: 0 -1px 6px rgba(34, 197, 94, 0.6);
    width: 0%;
    transition: width 0.1s ease-out;
    z-index: 10;
}

/* Bouton d'annulation affiché proprement à droite */
.download-cancel-btn {
    display: none; 
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: #ef4444;
    color: white;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    margin-right: 4px;
    flex-shrink: 0; /* Empêche le bouton d'être écrasé */
    z-index: 20;
}
.download-cancel-btn:hover {
    background: #b91c1c;
}

#toolbar-buttons button:focus { outline: none; box-shadow: none; }

/* Rend les boutons transparents et incliquables lorsqu'ils sont désactivés */
#toolbar-buttons button:disabled {
    opacity: 0.3 !important;
    cursor: not-allowed !important;
    background: #2d2d30 !important; /* Maintient le fond sombre */
    color: #6b7280 !important;      /* Écrit en gris sombre */
}


#url-bar input:focus {
    background: transparent;
    color: #d4d4d4;
}
    
#url-bar input:focus,
#url-bar input:focus-visible {
    outline: none !important;
    box-shadow: none !important;
    border: none !important;
}

/* Cache tous les onglets inactifs quand la barre est en mode maximisé */
#url-bar.maximized-mode > div {
    display: none !important;
}

/* Force l'affichage uniquement de l'onglet actif */
#url-bar.maximized-mode > div.panel-is-maximized {
    display: flex !important;
    flex: 1 1 0% !important;
}

/* Style de la barre principale ajusté pour aligner le bouton à droite */
/* ====== FIX ABSOLU : LA BARRE DE FAVORIS EN MODE CLAIR PAR DÉFAUT ====== */
#bookmarks-bar {
    height: 28px;
    width: 100%;
    background: #f3f4f6 !important;       /* Force le fond gris clair */
    border-bottom: 1px solid #e5e7eb !important; /* Bordure claire */
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: flex-start; 
    padding: 0 8px;
    overflow: hidden;
    gap: 6px;
}

/* Zone contenant uniquement la liste des badges */
#bookmarks-list {
    display: flex;
    gap: 6px;
    align-items: center;
    overflow-x: auto;
    flex: 1;
    height: 100%;
}
#bookmarks-list::-webkit-scrollbar {
    display: none; /* Masque la scrollbar */
}

/* Style du petit bouton X de fermeture tout à droite */
#close-bookmarks-bar {
    color: #6b7280;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.2s, color 0.2s;
    margin-left: 8px;
    flex-shrink: 0; /* Empêche la croix d'être écrasée */
}
#close-bookmarks-bar:hover {
    background: #991b1b; /* Devient rouge au survol */
    color: #fca5a5;
}

/* Masquer la barre de défilement pour garder l'interface propre */
#bookmarks-bar::-webkit-scrollbar {
    display: none;
}

/* Style des petits boutons de favoris */
.bookmark-item {
    background: #2d2d30;
    border: 1px solid #3c3c3c;
    color: #cfcfcf;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.2s, color 0.2s;
}

.bookmark-item:hover {
    background: #3f3f46;
    color: #ffffff;
    border-color: #555555;
}

/* Cache la barre des favoris si la classe de masquage est active */
body.bookmarks-hidden #bookmarks-bar {
    display: none !important;
}


/* Look des boutons par défaut (Mode Clair) */
#toolbar-buttons button {
    background: #ffffff !important;
    color: #1f2937 !important;
    border: 1px solid #d1d5db !important;
}

/* Look des conteneurs d'URL par défaut (Mode Clair) */
#url-bar > div {
    background: #ffffff !important;
    border: 1px solid #d1d5db !important;
}
#url-bar input {
    color: #1f2937 !important;
}

/* Badges de favoris par défaut (Mode Clair) */
.bookmark-item {
    background: #ffffff !important;
    color: #1f2937 !important;
    border: 1px solid #d1d5db !important;
}

/* ======================================================= */
/* BASCOULE EN MODE SOMBRE : PRÉFIXE .dark-ui              */
/* ======================================================= */
body.dark-ui {
    background: #252526 !important;
}


body.dark-ui #url-bar {
    background: #252526 !important;
    border-bottom: 1px solid #3c3c3c !important;
}

body.dark-ui #toolbar-buttons,
body.dark-ui #bookmarks-bar {
    background: #252526 !important;
    border-bottom: 1px solid #3c3c3c !important;
}
body.dark-ui #toolbar-buttons button {
    background: #2d2d30 !important;
    color: #d4d4d4 !important;
    border: 1px solid #3c3c3c !important;
}
body.dark-ui #url-bar > div {
    background: #2d2d30 !important;
    border: 1px solid #3c3c3c !important;
}
body.dark-ui #url-bar input {
    color: #d4d4d4 !important;
}
body.dark-ui .bookmark-item {
    background: #2d2d30 !important;
    color: #cfcfcf !important;
    border: 1px solid #3c3c3c !important;
}


/* Les badges de favoris par défaut (Mode Clair) */
.bookmark-item, 
#bookmarks-bar button,
#bookmarks-bar div {
    background: #ffffff !important;   /* Fond blanc pour le badge */
    color: #1f2937 !important;        /* Texte gris très sombre */
    border: 1px solid #d1d5db !important; /* Contour gris clair */
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
}

.bookmark-item:hover {
    background: #e5e7eb !important;   /* Effet de survol clair */
}

/* ====== BASCULE EN MODE SOMBRE (UNIQUEMENT VIA .dark-ui) ====== */
body.dark-ui #bookmarks-bar {
    background: #252526 !important;   /* Retour au fond sombre d'origine */
    border-bottom: 1px solid #3c3c3c !important;
}

body.dark-ui .bookmark-item,
body.dark-ui #bookmarks-bar button,
body.dark-ui #bookmarks-bar div {
    background: #2d2d30 !important;   /* Badges sombres */
    color: #cfcfcf !important;        /* Texte clair */
    border: 1px solid #3c3c3c !important;
}

</style>

<body class="m-0 flex items-center justify-center bg-gray-100 dark:bg-zinc-900 min-h-screen">


<!-- ====== DANS INDEX.HTML -> BARRE D'OUTILS SÉCURISÉE AVEC ICÔNES COMPATIBLES ====== -->
<div id="toolbar-buttons" class="fixed top-0 left-0 right-0 z-50">
    <button id="back-button" title="Revenir" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">&#9664;</button>
    <button id="forward-button" title="Avancer" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">&#9654;</button>
    
    <button id="refresh-button" title="Actualiser" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c; font-size:14px; cursor:pointer;">&#8635;</button>
    
    <!-- AJOUT ICI : Le bouton Mode Sombre -->
    <button id="dark-mode-button" title="Activer le mode sombre" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">🌙</button>


    <!-- L'attribut onclick appelle directement notre nouveau pont preload de manière brute -->
    <button id="history-button" title="Historique (Ctrl+H)" onclick="window.api.openHistoryWindow()" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; font-weight:bold; cursor:pointer; position:relative; z-index:999999 !important;">H</button>

    <!-- Scindage vertical : Deux barres verticales simples -->
    <button id="split-vertical" title="Scinder à droite (Ctrl+T)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:11px; font-weight:bold; cursor:pointer;">|</button>
    
    <!-- Scindage horizontal : Une barre horizontale simple -->
    <button id="split-horizontal" title="Scinder vers le bas (Ctrl+H)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:11px; font-weight:bold; cursor:pointer;">&mdash;</button>
    
    <!-- Bouton Undo d'annulation -->
    <button id="undo" title="Rouvrir le dernier panneau fermé (Ctrl+Z)" disabled style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">&#10554;</button>
    
    <button id="close-panel" title="Fermer le panneau actif (Ctrl+W)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:11px; cursor:pointer;">X</button>
</div>



<div id="url-bar" style="position: fixed; top: 38px; left: 0; right: 0; z-index: 50;"></div>
<div id="active-panel-frame"></div>

<!-- === REMPLACER LE CONTENEUR DE LA BARRE DES FAVORIS PAR CELUI-CI === -->
<div id="bookmarks-bar" style="position: fixed; top: 74px; left: 0; right: 0; z-index: 50;">
    <!-- Zone interne pour la liste des badges (défilante) -->
    <div id="bookmarks-list"></div>
    
    <!-- Bouton de fermeture fixe tout à droite -->
    <div id="close-bookmarks-bar" title="Masquer la barre des favoris (Ctrl+Shift+B)">✕</div>
</div>

<div id="active-panel-frame"></div>


<!-- Panneau latéral d'historique -->
<div id="history-sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3c3c3c; padding-bottom: 8px;">
        <span style="color: #ffffff; font-weight: bold; font-size: 13px;">Historique</span>
        <button id="clear-history-btn" style="background: #991b1b; color: #fca5a5; border: none; font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer;">Effacer tout</button>
    </div>
    <div id="history-list-container"></div>
</div>


<script>

let activePanel = null;
let currentPanels = []; // Stockage global pour maintenir la liste des panneaux
let currentMaximizedId = null; // Mémoire globale du mode zoom

// === LOGIQUE DE BASCULE DU MODE SOMBRE ===
let darkModeEnabled = false;
const darkModeBtn = document.getElementById("dark-mode-button");


// === CORRECTIF LOGIQUE CLIC BOUTON SOMBRE ===
if (darkModeBtn) {
    darkModeBtn.addEventListener("click", () => {
        // 1. On inverse l'état actuel
        darkModeEnabled = !darkModeEnabled;
        
        // 2. On synchronise immédiatement Electron avec la bonne valeur
        window.api.toggleDarkMode(darkModeEnabled);
        
        // 3. Mise à jour visuelle des barres de l'application
        if (darkModeEnabled) {
            document.body.classList.add("dark-ui"); // On active le look sombre
            darkModeBtn.innerText = "☀️";
            darkModeBtn.title = "Désactiver le mode sombre";
            darkModeBtn.style.background = "#eab308";
            darkModeBtn.style.color = "#000000";
        } else {
            document.body.classList.remove("dark-ui"); // On retire le look sombre (retour au clair)
            darkModeBtn.innerText = "🌙";
            darkModeBtn.title = "Activer le mode sombre";
            darkModeBtn.style.background = "#ffffff";
            darkModeBtn.style.color = "#1f2937";
            darkModeBtn.style.borderColor = "#d1d5db";
        }
    });
}


function refreshTabBorders() {
    const container = document.getElementById("url-bar");
    if (!container) return;

    const tabs = container.children;
    for (let i = 0; i < tabs.length; i++) {
        const tabWrapper = tabs[i];
        const input = tabWrapper.querySelector("input");
        if (!input) continue;

        const panelId = input.id.replace("-url", "");

        if (activePanel && panelId === activePanel) {
            tabWrapper.style.borderColor = "#3b82f6";
            tabWrapper.style.background = "#203a5d";
        } else {
            tabWrapper.style.borderColor = "#3c3c3c";
            tabWrapper.style.background = "#2d2d30";
        }
    }
}
function getDisplayUrl(url) {
    try {
        return "🔒 " + new URL(url).hostname.replace(/^www\./, "");
    } catch {
        return url || "";
    }
}

function attachUrlHandler(panelId) {
    const input = document.getElementById(panelId + "-url");
    if (!input) return;

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            window.api.navigate(panelId, e.target.value);
        }
    });
}

function rebuildUrlBar(panels) {
    const container = document.getElementById("url-bar");
    if (!container) return;
    
    container.innerHTML = "";
    container.style.display = "flex";
    container.style.gap = "8px";
    container.style.alignItems = "center";

    panels.forEach((panel) => {
        const tabWrapper = document.createElement("div");
        tabWrapper.className = "flex items-center gap-2 p-1 rounded";
        tabWrapper.style.background = "#2d2d30";
        tabWrapper.style.border = "1px solid #3c3c3c";
        tabWrapper.style.flex = "1";
        tabWrapper.style.minWidth = "0";
        tabWrapper.setAttribute("draggable", "true");
        tabWrapper.style.cursor = "grab";


        // ====== CHERCHEZ CE BLOC DANS LA FONCTION rebuildUrlBar ======
        if (activePanel && panel.id === activePanel) {
            tabWrapper.style.borderColor = "#3b82f6";
            // MODIFICATION ICI : On utilise des classes ou des variables CSS plutôt qu'un fond sombre forcé
            tabWrapper.style.background = darkModeEnabled ? "#203a5d" : "#bfdbfe"; // Bleu foncé si sombre, bleu clair si clair
            tabWrapper.classList.add("panel-is-maximized"); 
        } else {
            // Onglets inactifs : s'adaptent au mode choisi
            tabWrapper.style.background = darkModeEnabled ? "#2d2d30" : "#ffffff";
            tabWrapper.style.borderColor = darkModeEnabled ? "#3c3c3c" : "#d1d5db";
        }


        // --- GESTION DU DRAG & DROP ---
        tabWrapper.addEventListener("dragstart", (e) => {
            tabWrapper.style.opacity = "0.4";
            e.dataTransfer.setData("text/plain", panel.id);
            e.dataTransfer.effectAllowed = "move";
        });

        tabWrapper.addEventListener("dragend", () => {
            tabWrapper.style.opacity = "1";
            refreshTabBorders();
        });

        tabWrapper.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            tabWrapper.style.borderColor = "#3b82f6";
        });

        tabWrapper.addEventListener("dragleave", () => {
            tabWrapper.style.borderColor = (activePanel && panel.id === activePanel) ? "#3b82f6" : "#3c3c3c";
        });

        tabWrapper.addEventListener("drop", (e) => {
            e.preventDefault();
            const draggedPanelId = e.dataTransfer.getData("text/plain");
            if (draggedPanelId && draggedPanelId !== panel.id) {
                window.api.movePanel(draggedPanelId, panel.id);
            }
            refreshTabBorders();
        });

        // --- CRÉATION DE L'INPUT D'URL ---
        const input = document.createElement("input");
        input.type = "text";
        input.id = panel.id + "-url";
        input.className = "h-6 px-1 rounded";
        input.style.background = "transparent";
        input.style.color = "#d4d4d4";
        input.style.border = "none";
        input.style.outline = "none";
        input.style.width = "100%";
        input.style.fontSize = "12px";
        input.dataset.url = panel.realUrl || panel.url || "";
        input.value = getDisplayUrl(input.dataset.url);

        input.addEventListener("mousedown", () => tabWrapper.setAttribute("draggable", "false"));
        window.addEventListener("mouseup", () => tabWrapper.setAttribute("draggable", "true"));

        input.addEventListener("click", (e) => {
            e.stopPropagation();
            window.api.setActivePanel(panel.id);
        });

        input.addEventListener("focus", () => {
            window.api.setActivePanel(panel.id);
            input.value = input.dataset.url;
            setTimeout(() => {
                input.setSelectionRange(0, input.value.length);
            }, 10);
        });            

        input.addEventListener("blur", () => {
            input.value = getDisplayUrl(input.dataset.url);
        });











        // --- CRÉATION DE L'INPUT D'URL (votre code existant) ---
        tabWrapper.appendChild(input);

        // === AJOUT : BOUTON ÉTOILE DE FAVORI ===
        const starBtn = document.createElement("div");
        starBtn.className = "btn-favori";
        starBtn.id = `star-${panel.id}`;
        starBtn.innerText = "☆"; // Étoile vide par défaut
        starBtn.title = "Ajouter aux favoris";

        // Style de base en ligne pour s'assurer de sa visibilité immédiate
        starBtn.style.cursor = "pointer";
        starBtn.style.fontSize = "14px";
        starBtn.style.marginRight = "6px";
        starBtn.style.userSelect = "none";
        starBtn.style.color = "#6b7280"; // Gris par défaut
        starBtn.style.zIndex = "20";

        // Empêche le clic de perturber le drag and drop ou le focus de l'onglet
        starBtn.addEventListener("mousedown", (e) => e.stopPropagation());
        
        starBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const currentUrl = input.dataset.url || panel.url || "";
            const currentTitle = panel.title || input.value;
            
            // Appel au processus principal
            const isAdded = await window.api.toggleFavori({ url: currentUrl, title: currentTitle });
            
            // Mise à jour visuelle immédiate locale
            starBtn.innerText = isAdded ? "★" : "☆";
            starBtn.style.color = isAdded ? "#eab308" : "#6b7280"; // Jaune si actif
        });

        tabWrapper.appendChild(starBtn);

        // --- CRÉATION DU BOUTON D'ANNULATION DU TÉLÉCHARGEMENT (votre code existant) ---
        const cancelBtn = document.createElement("div");

        // --- CRÉATION DE LA BARRE DE PROGRESSION ---
        const progBar = document.createElement("div");
        progBar.className = "download-progress-bar";
        progBar.id = `prog-${panel.id}`;
        tabWrapper.appendChild(progBar);

        container.appendChild(tabWrapper);
        attachUrlHandler(panel.id);
    });
}

// --- ÉCOUTEURS DES BOUTONS DE LA BARRE D'OUTILS ---

document.getElementById("forward-button").addEventListener("click", () => window.api.goForward(activePanel));

// === FONCTIONS GLOBALES POUR LA SYNCHRONISATION DES FAVORIS ===

// 1. Déclaration de la fonction de vérification
async function checkFavorisState() {
    if (typeof currentPanels === 'undefined' || !currentPanels) return;
    
    // On demande la liste des favoris à Electron
    const favoris = await window.api.getFavoris?.() || [];
    
    currentPanels.forEach(panel => {
        const input = document.getElementById(`${panel.id}-url`);
        const starBtn = document.getElementById(`star-${panel.id}`);
        
        if (input && starBtn) {
            const currentUrl = input.dataset.url || panel.url || "";
            const isFavori = favoris.some(f => f.url === currentUrl);
            
            starBtn.innerText = isFavori ? "★" : "☆";
            starBtn.style.color = isFavori ? "#eab308" : "#6b7280"; // Allume en jaune si favori
            starBtn.title = isFavori ? "Retirer des favoris" : "Ajouter aux favoris";
        }
    });
}

// 2. Écouteur pour intercepter le signal de mise à jour (ex: clic ou Ctrl+D)
window.api.onFavorisUpdated?.((favoris) => {
    checkFavorisState();
});


// === SÉCURISATION DU FOCUS DU PANNEAU ===
window.api.onFocusUrlBar?.((panelId) => {
    activePanel = panelId;
    refreshTabBorders();
    
    const input = document.getElementById(panelId + "-url");
    if (input) {
        setTimeout(() => {
            input.focus();
            input.setSelectionRange(0, input.value.length);
        }, 5);
    }
    
    // On demande à Electron de réactiver le liseré au focus de manière propre
    window.api.setActivePanel(panelId);
});

window.api.onActivePanelChanged((panel) => {
    if (!panel) return;
    activePanel = panel.id;
    refreshTabBorders();
    const frame = document.getElementById("active-panel-frame");
    if (frame && panel.bounds) {
        frame.style.display = "block";
        frame.style.left = panel.bounds.x + "px";
        frame.style.top = panel.bounds.y + "px";
        frame.style.width = panel.bounds.width + "px";
        frame.style.height = panel.bounds.height + "px";
    }
    const state = navigationStates[panel.id] || { canGoBack: false, canGoForward: false };
    updateToolbarButtons(state.canGoBack, state.canGoForward);
    updateCloseButtonState();
});

window.api.onNavigationState((state) => {
    document.getElementById("back-button").disabled = !state.canGoBack;
    document.getElementById("forward-button").disabled = !state.canGoForward;
});

const navigationStates = {};

window.api.onNavigationStateChanged((data) => {
    navigationStates[data.panelId] = {
        canGoBack: data.canGoBack,
        canGoForward: data.canGoForward
    };
    if (activePanel === data.panelId) {
        updateToolbarButtons(data.canGoBack, data.canGoForward);
    }
});

window.api.onZoomChanged((maximizedPanelId) => {
    currentMaximizedId = maximizedPanelId; // Garde la synchro
    const container = document.getElementById("url-bar");
    if (!container) return;

    if (maximizedPanelId) {
        container.classList.add("maximized-mode");
        const activeInput = document.getElementById(maximizedPanelId + "-url");
        if (activeInput && activeInput.parentElement) {
            activeInput.parentElement.classList.add("panel-is-maximized");
        }
    } else {
        container.classList.remove("maximized-mode");
    }
});




function updateCloseButtonState() {
    const closeBtn = document.getElementById("close-panel");
    if (!closeBtn) return;

    // Si activePanel est null ou indéfini, on désactive le bouton X
    if (!activePanel) {
        closeBtn.disabled = true;
        closeBtn.style.cursor = "not-allowed";
        closeBtn.title = "Aucun panneau sélectionné";
    } else {
        closeBtn.disabled = false;
        closeBtn.style.cursor = "pointer";
        closeBtn.title = "Fermer le panneau actif";
    }
}


function updateToolbarButtons(canGoBack, canGoForward) {
    const backBtn = document.getElementById("back-button");
    const forwardBtn = document.getElementById("forward-button");

    if (backBtn) {
        backBtn.disabled = !canGoBack;
        backBtn.style.opacity = canGoBack ? "1" : "0.4";
        backBtn.style.cursor = canGoBack ? "pointer" : "not-allowed";
    }
    if (forwardBtn) {
        forwardBtn.disabled = !canGoForward;
        forwardBtn.style.opacity = canGoForward ? "1" : "0.4";
        forwardBtn.style.cursor = canGoForward ? "pointer" : "not-allowed";
    }
}

// --- ÉCOUTEURS DE TÉLÉCHARGEMENT SÉCURISÉS ---
window.api.onDownloadProgress((data) => {
    if (!data || !data.panelId) return;

    const progBar = document.getElementById(`prog-${data.panelId}`);
    const cancelBtn = document.getElementById(`cancel-dl-${data.panelId}`);
    const input = document.getElementById(`${data.panelId}-url`);
    
    if (progBar) {
        progBar.style.width = `${data.percent}%`;
    }
    if (cancelBtn) {
        cancelBtn.style.display = "flex";
    }
    if (input && document.activeElement !== input) {
        input.value = `📥 (${data.percent}%) ${data.filename}`;
        input.style.color = "#f97316"; 
    }
});

window.api.onDownloadDone((data) => {
    if (!data || !data.panelId) return;

    const progBar = document.getElementById(`prog-${data.panelId}`);
    const cancelBtn = document.getElementById(`cancel-dl-${data.panelId}`);

    if (progBar) progBar.style.width = "0%";
    if (cancelBtn) cancelBtn.style.display = "none";

    refreshTabBorders();

    if (typeof currentPanels !== 'undefined' && currentPanels) {
        const input = document.getElementById(`${data.panelId}-url`);
        const panelData = currentPanels.find(p => p.id === data.panelId);
        if (input && panelData) {
            input.value = getDisplayUrl(panelData.realUrl || panelData.url || "");
            input.style.color = "#d4d4d4";
        }
    }

    const container = document.getElementById("url-bar");
    if (container && currentMaximizedId) {
        container.classList.add("maximized-mode");
        const activeInput = document.getElementById(`${currentMaximizedId}-url`);
        if (activeInput && activeInput.parentElement) {
            activeInput.parentElement.classList.add("panel-is-maximized");
        }
    }
});



// === FONCTION POUR DESSINER LA BARRE DES FAVORIS ===
// === FONCTION DE RECONSTRUCTION DE LA BARRE CORRIGÉE ===
async function rebuildBookmarksBar() {
    // MODIFICATION : On cible la liste interne et non la barre complète
    const listContainer = document.getElementById("bookmarks-list");
    if (!listContainer) return;

    const favoris = await window.api.getFavoris?.() || [];
    listContainer.innerHTML = "";

    if (favoris.length === 0) {
        const emptyText = document.createElement("span");
        emptyText.style.color = "#6b7280";
        emptyText.style.fontSize = "11px";
        emptyText.innerText = "Aucun favori enregistré. Cliquez sur ☆ pour en ajouter.";
        listContainer.appendChild(emptyText);
        return;
    }

    favoris.forEach(fav => {
        const btn = document.createElement("div");
        btn.className = "bookmark-item";
        btn.innerText = "🔖 " + fav.title.replace("🔒 ", "");
        btn.title = fav.url;

        btn.addEventListener("click", () => {
            if (activePanel) {
                window.api.navigate(activePanel, fav.url);
            }
        });

        listContainer.appendChild(btn);
    });
}

// Modifiez votre écouteur onFavorisUpdated existant pour qu'il rafraîchisse aussi la barre :
window.api.onFavorisUpdated?.((favoris) => {
    checkFavorisState();
    rebuildBookmarksBar(); // <-- AJOUTÉ ICI
});









// Appeler la fonction une première fois au démarrage (dans l'écouteur onPanelsUpdated par exemple)
window.api.onPanelsUpdated((panels, maximizedPanelId) => {
    currentPanels = panels;
    currentMaximizedId = maximizedPanelId;
    rebuildUrlBar(panels);

    // ====== À METTRE TOUT EN BAS DE VOTRE SCRIPT DANS INDEX.HTML ======

        // On lui attribue son action de clic officielle et sécurisée

        }
    }, 0);
});


// ====== LOGIQUE DE L'HISTORIQUE DANS INDEX.HTML ======

// ===================================================
// LOGIQUE DE L'HISTORIQUE CORRIGÉE ET RÉORDONNÉE
// ===================================================

const historySidebar = document.getElementById("history-sidebar");
const historyContainer = document.getElementById("history-list-container");

// 1. Fonction pour ouvrir/fermer le volet
function toggleHistorySidebar() {
    if (!historySidebar) return;
    historySidebar.classList.toggle("open");

    if (historySidebar.classList.contains("open")) {
        renderHistory();
    }
}

async function renderHistory(historyList) {
    if (!window.api.getHistory) {
        console.error("L'API getHistory n'est pas définie dans preload.js");
        return;
    }

    if (!historyList) {
        historyList = await window.api.getHistory() || [];
    }
    
    historyContainer.innerHTML = "";
    
    if (historyList.length === 0) {
        historyContainer.innerHTML = '<span style="color: #6b7280; font-size: 11px; padding: 8px; display: block;">Aucun historique disponible.</span>';
        return;
    }
    
    historyList.forEach((item, index) => {
        // Conteneur principal de la ligne
        const div = document.createElement("div");
        div.className = "history-item";
        div.style.display = "flex";
        div.style.justify = "space-between";
        div.style.alignItems = "center";
        
        // Texte du lien
        const textSpan = document.createElement("span");
        textSpan.innerText = item.title || item.url;
        textSpan.title = `${item.title}\n${item.url}`;
        textSpan.style.overflow = "hidden";
        textSpan.style.textOverflow = "ellipsis";
        textSpan.style.flex = "1";
        
        textSpan.addEventListener("click", () => {
            if (activePanel) {
                window.api.navigate(activePanel, item.url);
                toggleHistorySidebar();
            }
        });
        
        // Bouton de suppression unique
        const deleteBtn = document.createElement("span");
        deleteBtn.innerHTML = "&#10006;"; // Code pour l'icône X
        deleteBtn.style.color = "#ef4444";
        deleteBtn.style.cursor = "pointer";
        deleteBtn.style.marginLeft = "8px";
        deleteBtn.style.padding = "2px 4px";
        deleteBtn.title = "Supprimer cet élément";
        
        deleteBtn.addEventListener("click", async (e) => {
            e.stopPropagation(); // Évite de déclencher le clic de navigation
            if (window.api.deleteHistoryItem) {
                const updated = await window.api.deleteHistoryItem(index);
                renderHistory(updated);
            }
        });
        
        div.appendChild(textSpan);
        div.appendChild(deleteBtn);
        historyContainer.appendChild(div);
    });
}

// 3. Écouteur pour le bouton de la barre d'outils
document.getElementById("history-button").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleHistorySidebar();
});

// 4. Écouteur pour le bouton de nettoyage
document.getElementById("clear-history-btn").addEventListener("click", async () => {
    if (confirm("Voulez-vous vraiment effacer tout votre historique ?")) {
        if (window.api.clearHistory) {
            await window.api.clearHistory();
            renderHistory([]); // Force le vidage visuel immédiat
        }
    }
});


// 5. Écoute les mises à jour en arrière-plan (La variable historySidebar est maintenant bien déclarée avant !)
window.api.onHistoryUpdated?.((updatedHistory) => {
    if (historySidebar && historySidebar.classList.contains("open")) {
        renderHistory(updatedHistory);
    }
});

// 6. Gestion du raccourci clavier Ctrl+H depuis l'IHM
window.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'h') {
        e.preventDefault();
        toggleHistorySidebar();
    }
});

async function initThemeFromSystem() {
    if (window.api && window.api.getInitialTheme) {
        const isSystemDark = await window.api.getInitialTheme();
        
        if (isSystemDark) {
            darkModeEnabled = true;
            document.body.classList.add("dark-ui"); // On applique les couleurs sombres
            if (darkModeBtn) {
                darkModeBtn.innerText = "☀️";
                darkModeBtn.title = "Désactiver le mode sombre";
                darkModeBtn.style.background = "#eab308";
                darkModeBtn.style.color = "#000000";
            }
        } else {
            darkModeEnabled = false;
            document.body.classList.remove("dark-ui"); // On reste sur le thème clair par défaut
            if (darkModeBtn) {
                darkModeBtn.innerText = "🌙";
                darkModeBtn.title = "Activer le mode sombre";
                darkModeBtn.style.background = "#ffffff";
                darkModeBtn.style.color = "#1f2937";
                darkModeBtn.style.borderColor = "#d1d5db";
            }
        }
    }
}
initThemeFromSystem();
