<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="tailwind.css">

    <title>Tile Browser</title>
</head>
<style>

#toolbar-buttons {
    height: 32px;
    display: flex;
    align-items: center;
    gap: 4px;

    padding-left: 6px;
    padding-right: 6px;

    background: #252526;

    border-bottom: 1px solid #3c3c3c;
}

#toolbar-buttons button:focus {
    outline: 1px solid #007acc;
    outline-offset: 1px;
}

#url-bar {
    display: flex;
    gap: 6px;

    padding: 4px 6px;

    background: #1e1e1e;
}


#handle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 100%;
    height: 100%;
}

.dot {
    display: block;

    width: 2px;
    height: 2px;

    background: #d0d0d0;

    border-radius: 50%;
}

#url-bar input {
    background: #1e1e1e;
    color: #d4d4d4;
    border: 1px solid #3c3c3c;
}

#url-bar input:focus {
    outline: none;
    box-shadow: none;
}

.active-panel {
    border: 1px solid #007acc !important;
}



#splitter {
    position: absolute;

    left: 800px;
    top: 40px;

    width: 12px;
    height: calc(100vh - 40px);

    background: #d0d0d0;

    cursor: col-resize;
}

#splitter:hover {
    background: #d0d0d0;
}

#splitter-handle {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 16px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;
}

#splitter-handle::before {
    content: "●\A●\A●";

    white-space: pre;

    color: #666;

    font-size: 8px;

    line-height: 8px;
}

#splitter.dragging {
    background: #6b6b6b;
}

#splitter-handle {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: auto;
    height: auto;

    background: transparent;
}


#splitter:hover #splitter-handle::before {
    color: #666;
}


#splitter.centering {
    background: #4da3ff;

    transform: scaleX(1.8);

    transition:
        background 0.2s,
        transform 0.2s;
}    

#splitter-layer {

    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 9999;
}

.splitter {
    position: absolute;

    min-width: 8px;
    min-height: 8px;

    pointer-events: auto;

    z-index: 10000;

    background: rgba(255,0,0,0.4);
}

.splitter:hover {
    background:#606060;
}

.vertical-splitter {
    cursor: col-resize;
}

.horizontal-splitter {
    cursor: row-resize;
}

#url-bar {
    display: flex;
    gap: 2px;
    height: 30px;
}

#url-bar input {
    flex: 1;
    min-width: 100px;
}


</style>    

</head>

<body class="m-0 flex items-center justify-center bg-gray-100 dark:bg-zinc-900 min-h-screen">









<div id="toolbar-buttons">


        <button
            id="split-vertical"
            style="
                width:28px;
                height:24px;
                background:#2d2d30;
                color:#d4d4d4;
                border:1px solid #3c3c3c;
            "
        >
            ⇆
        </button>

                <button id="split-horizontal"
            style="
                background:#2d2d30;
                color:#d4d4d4;
                border:1px solid #3c3c3c;
                width:28px;
                height:24px;
            "
                >
                    ⇅
                </button>

                <button id="undo"
            style="
                background:#2d2d30;
                color:#d4d4d4;
                border:1px solid #3c3c3c;
                width:28px;
                height:24px;
            "
                >
                    ↶
                </button>

                <button id="close-panel"
            style="
                background:#2d2d30;
                color:#d4d4d4;
                border:1px solid #3c3c3c;
                width:28px;
                height:24px;
            "
                >
                    X
                </button>


</div>

<div id="url-bar"></div>


</body>

<script>


const input = document.getElementById("panel1-url");

function attachUrlHandler(panelId)
{
    const input =
        document.getElementById(
            panelId + "-url"
        );

    if (!input) {
        return;
    }

    input.addEventListener(
        "keydown",
        (e) => {

            if (e.key !== "Enter") {
                return;
            }

            window.api.navigate(
                panelId,
                e.target.value
            );

        }
    );
}
function rebuildUrlBar(panels)
{
    const container =
        document.getElementById(
            "url-bar"
        );

    container.innerHTML = "";

    panels.forEach(
        (panel) => {

            const input =
                document.createElement(
                    "input"
                );

            input.className =
                "h-6 px-2 rounded";

            input.style.background = "#1e1e1e";
            input.style.color = "#d4d4d4";
            input.style.border = "1px solid #3c3c3c";

            input.id =
                panel.id + "-url";




            input.type =
                "text";

            input.value =
                panel.url || "";

            input.addEventListener(
                "click",
                () => {

                    selectPanel(
                        panel.id
                    );

                }
            );

            input.addEventListener(
                "focus",
                () => {

                    selectPanel(
                        panel.id
                    );

                }
            );

            container.appendChild(
                input
            );

            attachUrlHandler(
                panel.id
            );
        }
    );
}

attachUrlHandler("panel1");
attachUrlHandler("panel2");
attachUrlHandler("panel3");


const splitVerticalButton =
    document.getElementById(
        "split-vertical"
    );

const splitHorizontalButton =
    document.getElementById(
        "split-horizontal"
    );

const closeButton =
document.getElementById(
    "close-panel"
);


console.log(window.api);


splitVerticalButton.addEventListener(
    "click",
    () => {

        console.log(
            "Découpage vertical de",
            activePanel
        );

    }
);

splitHorizontalButton.addEventListener(
    "click",
    () => {

        console.log(
            "Découpage horizontal de",
            activePanel
        );

    }
);


splitVerticalButton.addEventListener(
    "click",
    () => {

        window.api.splitPanel(
            activePanel,
            "vertical"
        );

    }
);

splitHorizontalButton.addEventListener(
    "click",
    () => {

        window.api.splitPanel(
            activePanel,
            "horizontal"
        );

    }
);

closeButton.addEventListener(
    "click",
    () => {

        window.api.closePanel(
            activePanel
        );

    }
);


window.api.onPanelsUpdated(
    (panels) => {

        rebuildUrlBar(
            panels
        );

    }
);
function selectPanel(panelId)
{
    activePanel = panelId;


document
    .querySelectorAll("#url-bar input")
    .forEach((input) => {

        console.log(
            input.id,
            input.className
        );

    });

    console.log(
        "PANNEAU ACTIF =",
        activePanel
    );

    document
        .querySelectorAll(
            "#url-bar input"
        )
        .forEach(
            (input) => {

                input.classList.remove(
                    "active-panel"
                );

            }
        );

    document
        .getElementById(
            panelId + "-url"
        )
        ?.classList.add(
            "active-panel"
        );
}
let dragging = false;


document.addEventListener(
    "mousedown",
    (event) => {

        console.log(
            "DOWN",
            event.screenX,
            event.screenY,
            event.clientY
        );

        dragging = true;

document.title =
    "drag-start:" +
    event.screenX +
    ":" +
    event.clientY;
    }
);

let currentX = 800;

let activePanel = "panel1";

let draggedSplitter = null;















document.addEventListener(
    "mousemove",
    (event) => {

        if (!dragging) {
            return;
        }

console.log(
    "EVENT",
    event.screenY,
    event.clientY,
    event.pageY,
    event.y
);


document.title =
    "move:" +
    event.screenX +
    ":" +
    event.clientY;
    }
);  

document.addEventListener(
    "mouseup",
    () => {

        window.api.stopSplitterDrag();

    }
);



window.addEventListener(
    "mouseleave",
    () => {
        dragging = false;
        splitter.classList.remove(
            "dragging"
        );
    }
);




closeButton.addEventListener(
    "click",
    () => {

        console.log(
            "BOUTON X CLIQUE"
        );

        window.api.closePanel(
            activePanel
        );

    }
);


document
    .getElementById("undo")
    .addEventListener(
        "click",
        () => {

            window.api.undo();

        }
    );


window.api.onActivePanelChanged(
    (panelId) => {

        console.log(
            "PANNEAU ACTIF RECU :",
            panelId
        );

        selectPanel(
            panelId
        );

    }
);

window.api.onSplittersUpdated(
    (splitters) => {

        console.log(
            "Splitters reçus :",
            splitters
        );

        const layer =
            document.getElementById(
                "splitter-layer"
            );

        layer.innerHTML = "";

        splitters.forEach(
            (splitter) => {

const div =
    document.createElement(
        "div"
    );

div.className =
    "splitter";

div.style.cursor =
    splitter.direction === "vertical"
        ? "col-resize"
        : "row-resize";





                div.style.left =
                    splitter.x + "px";

                div.style.top =
                    splitter.y + "px";

                div.style.width =
                    splitter.width + "px";

                div.style.height =
                    splitter.height + "px";

console.log(
    "SPLITTER RECU",
    splitter
);

div.style.background =
    "#454545";

                layer.appendChild(
                    div
                );

                if (
                    splitter.direction ===
                    "vertical"
                )
                {

div.classList.add(
    "vertical-splitter"
);                    
                }
                else
                {

div.classList.add(
    "horizontal-splitter"
);
                }

            }


        );

    }
);


console.log(
    "API =",
    window.api
);

</script>
</body>
</html>
