<!DOCTYPE html>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #252526; /* Fond sombre identique aux barres */
    display: flex;
    flex-direction: column; /* Aligne la barre de boutons puis la barre d'URL */
}


#active-panel-frame {
    position: absolute;
    border: 2px solid #3b82f6;
    box-sizing: border-box;
    pointer-events: none; /* TRÈS IMPORTANT : permet de cliquer à travers */
    z-index: 9999;
    display: none;
}

#toolbar-buttons {
    height: 38px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 4px;
    background: #252526;
    border-bottom: 1px solid #3c3c3c;
    padding: 4px 8px;
    box-sizing: border-box;
}

#url-bar {
    height: 36px;
    width: 100%;
    background: #252526;
    border-bottom: 1px solid #3c3c3c;
    box-sizing: border-box;
    display: flex;
    gap: 8px;
    padding: 0 8px;
    align-items: center;
    top: 35px;
}



 
#url-bar > div {
    margin: 0;
}

#toolbar-buttons button:focus { outline: none; box-shadow: none; }
#toolbar-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }


#url-bar input:focus {
    background: transparent;
    color: #d4d4d4;
}
    
#url-bar input:focus,
#url-bar input:focus-visible {
    outline: none !important;
    box-shadow: none !important;
    border: none !important;
}

/* Cache tous les onglets inactifs quand la barre est en mode maximisé */
#url-bar.maximized-mode > div {
    display: none !important;
}

/* Force l'affichage uniquement de l'onglet actif */
#url-bar.maximized-mode > div.panel-is-maximized {
    display: flex !important;
    flex: 1 1 0% !important;
}

</style>

<body class="m-0 flex items-center justify-center bg-gray-100 dark:bg-zinc-900 min-h-screen">


<div id="toolbar-buttons" class="fixed top-0 left-0 right-0 z-50">
    <button id="back-button" title="Revenir" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c;">←</button>
    <button id="forward-button" title="Avancer" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c;">→</button>

    <button id="split-horizontal" title="Scinder vers le bas" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c;">◩</button>
    <button id="undo" title="Rouvrir le dernier panneau fermé" disabled style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c;">↶</button>
    <button id="close-panel" title="Fermer le panneau actif" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c;">✕</button>
</div>

function refreshTabBorders() {
    const container = document.getElementById("url-bar");
    if (!container) return;

    // Récupère tous les wrappers d'onglets enfants directs du url-bar
    const tabs = container.children;
    
    for (let i = 0; i < tabs.length; i++) {
        const tabWrapper = tabs[i];
        // Retrouve l'input interne pour identifier à quel panneau il est lié
        const input = tabWrapper.querySelector("input");
        if (!input) continue;

        // Extrait l'ID du panneau depuis l'ID de l'input (ex: "panel1-url" -> "panel1")
        const panelId = input.id.replace("-url", "");

        // Applique le style correspondant à l'état actif ou inactif
        if (activePanel && panelId === activePanel) {
            tabWrapper.style.borderColor = "#3b82f6";
            tabWrapper.style.background = "#203a5d";
        } else {
            tabWrapper.style.borderColor = "#3c3c3c";
            tabWrapper.style.background = "#2d2d30";
        }
    }
}


function getDisplayUrl(url) {
    try {
        return "🔒 " + new URL(url).hostname.replace(/^www\./, "");
    } catch {
        return url || "";
    }
}

function attachUrlHandler(panelId) {
    const input = document.getElementById(panelId + "-url");
    if (!input) return;

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            window.api.navigate(panelId, e.target.value);
        }
    });
}

function rebuildUrlBar(panels) {
    const container = document.getElementById("url-bar");
    if (!container) return;
    
    container.innerHTML = "";
    container.style.display = "flex";
    container.style.gap = "8px";
    container.style.alignItems = "center";

    panels.forEach((panel) => {
        const tabWrapper = document.createElement("div");
        tabWrapper.className = "flex items-center gap-2 p-1 rounded";
        tabWrapper.style.background = "#2d2d30";
        tabWrapper.style.border = "1px solid #3c3c3c";
        tabWrapper.style.flex = "1";
        tabWrapper.style.minWidth = "0";
        tabWrapper.setAttribute("draggable", "true");
        tabWrapper.style.cursor = "grab";

        if (activePanel && panel.id === activePanel) {
            tabWrapper.style.borderColor = "#3b82f6";
            tabWrapper.style.background = "#203a5d";
            // Ajout de la classe de repère pour le CSS
            tabWrapper.classList.add("panel-is-maximized"); 
        }


        // ... Tout le reste de votre boucle panels.forEach (dragstart, drop, input, etc.) reste STRICTEMENT identique
        tabWrapper.addEventListener("dragstart", (e) => {
            tabWrapper.style.opacity = "0.4";
            e.dataTransfer.setData("text/plain", panel.id);
            e.dataTransfer.effectAllowed = "move";
        });

        tabWrapper.addEventListener("dragend", () => {
            tabWrapper.style.opacity = "1";
            refreshTabBorders();
        });

        tabWrapper.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            tabWrapper.style.borderColor = "#3b82f6";
        });

        tabWrapper.addEventListener("dragleave", () => {
            tabWrapper.style.borderColor = (activePanel && panel.id === activePanel) ? "#3b82f6" : "#3c3c3c";
        });

        tabWrapper.addEventListener("drop", (e) => {
            e.preventDefault();

            const draggedPanelId =
                e.dataTransfer.getData("text/plain");

            if (draggedPanelId && draggedPanelId !== panel.id) {
                window.api.movePanel(draggedPanelId, panel.id);
            }

            refreshTabBorders();
        });

        const input = document.createElement("input");
        input.type = "text";
        input.id = panel.id + "-url";
        input.className = "h-6 px-1 rounded";
        input.style.background = "transparent";
        input.style.color = "#d4d4d4";
        input.style.border = "none";
        input.style.outline = "none";
        input.style.width = "100%";
        input.style.fontSize = "12px";
        input.dataset.url = panel.realUrl || panel.url || "";
        input.value = getDisplayUrl(input.dataset.url);

        input.addEventListener("mousedown", () => tabWrapper.setAttribute("draggable", "false"));
        window.addEventListener("mouseup", () => tabWrapper.setAttribute("draggable", "true"));

        input.addEventListener("click", (e) => {
            e.stopPropagation();
            window.api.setActivePanel(panel.id);
        });

        // Modifiez ce bloc spécifique à l'intérieur de rebuildUrlBar :
        input.addEventListener("focus", () => {
            window.api.setActivePanel(panel.id);
            input.value = input.dataset.url;
            
            // L'utilisation d'un très léger délai empêche le clic de souris 
            // d'annuler la sélection juste après l'activation du focus
            setTimeout(() => {
                input.setSelectionRange(0, input.value.length);
            }, 10);
        });            

        input.addEventListener("blur", () => {
            input.value = getDisplayUrl(input.dataset.url);
        });

        tabWrapper.appendChild(input);
        container.appendChild(tabWrapper);
        attachUrlHandler(panel.id);

        // === LA FUITE DE MÉMOIRE A ÉTÉ SUPPRIMÉE ICI ===
        // Le bloc "window.api.onPanelsUpdated" qui s'auto-répétait a été retiré.
    });

        // Modifiez ce bloc spécifique à l'intérieur de rebuildUrlBar :
        input.addEventListener("focus", () => {
            window.api.setActivePanel(panel.id);
            input.value = input.dataset.url;
            
            // L'utilisation d'un très léger délai empêche le clic de souris 
            // d'annuler la sélection juste après l'activation du focus
            setTimeout(() => {
                input.setSelectionRange(0, input.value.length);
            }, 10);
        });            
}






    document.getElementById("back-button").addEventListener("click", () => window.api.goBack(activePanel));
    document.getElementById("forward-button").addEventListener("click", () => window.api.goForward(activePanel));
    document.getElementById("refresh-button").addEventListener("click", () => window.api.refresh(activePanel));
    document.getElementById("split-vertical").addEventListener("click", () => window.api.splitPanel(activePanel, "vertical"));
    document.getElementById("split-horizontal").addEventListener("click", () => window.api.splitPanel(activePanel, "horizontal"));
    document.getElementById("close-panel").addEventListener("click", () => window.api.closePanel(activePanel));
    document.getElementById("undo").addEventListener("click", () => window.api.undo());


    window.api.onPanelsUpdated((panels, maximizedPanelId) => {
        currentPanels = panels;
        rebuildUrlBar(panels);

        // === AJOUT ICI : Gestion de la classe sur le conteneur global ===
        const container = document.getElementById("url-bar");
        if (container) {
            if (maximizedPanelId) {
                container.classList.add("maximized-mode");
            } else {
                container.classList.remove("maximized-mode");
            }
        }

        setTimeout(() => {
            if (document.activeElement instanceof HTMLInputElement) {
                document.activeElement.blur();
            }
        }, 0);
    });


    window.api.onUndoAvailable((available) => document.getElementById("undo").disabled = !available);



    // Écoute l'ordre du raccourci Ctrl+L pour donner le focus et tout sélectionner
    window.api.onFocusUrlBar?.((panelId) => {
        const input = document.getElementById(panelId + "-url");
        if (input) {
            setTimeout(() => {
                input.focus();
                // Force la sélection absolue de tous les caractères du champ
                input.setSelectionRange(0, input.value.length);
            }, 5);
        }
    });


    window.api.onActivePanelChanged((panel) => {
        activePanel = panel.id;

        refreshTabBorders();

        const frame = document.getElementById("active-panel-frame");
        if (frame && panel.bounds) {
            frame.style.display = "block";
            frame.style.left = panel.bounds.x + "px";
            frame.style.top = panel.bounds.y + "px";
            frame.style.width = panel.bounds.width + "px";
            frame.style.height = panel.bounds.height + "px";
        }
    });

    window.api.onNavigationState((state) => {
        document.getElementById("back-button").disabled =
            !state.canGoBack;

        document.getElementById("forward-button").disabled =
            !state.canGoForward;
    });

    // Stockage local des états de navigation pour chaque panneau
    const navigationStates = {};

    window.api.onNavigationStateChanged((data) => {
        // On enregistre l'état du panneau qui vient de naviguer
        navigationStates[data.panelId] = {
            canGoBack: data.canGoBack,
            canGoForward: data.canGoForward
        };

        // Si le panneau mis à jour est celui actuellement actif à l'écran, on applique les changements
        if (activePanel === data.panelId) {
            updateToolbarButtons(data.canGoBack, data.canGoForward);
        }
    });


    // === NOUVEL ÉCOUTEUR DIRECT DE ZOOM ===
    window.api.onZoomChanged((maximizedPanelId) => {
        const container = document.getElementById("url-bar");
        if (!container) return;

        if (maximizedPanelId) {
            container.classList.add("maximized-mode");
            
            // On s'assure qu'un onglet est bien marqué comme actif au cas où
            const activeInput = document.getElementById(maximizedPanelId + "-url");
            if (activeInput && activeInput.parentElement) {
                activeInput.parentElement.classList.add("panel-is-maximized");
            }
        } else {
            container.classList.remove("maximized-mode");
        }
    });




    // Épauler le changement de panneau actif pour rafraîchir aussi les boutons
    window.api.onActivePanelChanged((panel) => {
        activePanel = panel.id;
        
        // ... votre code existant pour la bordure et la classe active-panel ...
        document.querySelectorAll("#url-bar input").forEach(i => i.classList.remove("active-panel"));
        document.getElementById(panel.id + "-url")?.classList.add("active-panel");
        
        const frame = document.getElementById("active-panel-frame");
        if (frame && panel.bounds) {
            frame.style.display = "block";
            frame.style.left = panel.bounds.x + "px";
            frame.style.top = panel.bounds.y + "px";
            frame.style.width = panel.bounds.width + "px";
            frame.style.height = panel.bounds.height + "px";
        }

        // Récupérer l'état sauvegardé de ce panneau ou mettre false par défaut
        const state = navigationStates[panel.id] || { canGoBack: false, canGoForward: false };
        updateToolbarButtons(state.canGoBack, state.canGoForward);
    });

// Fonction utilitaire pour modifier l'état visuel des boutons de la barre d'outils
function updateToolbarButtons(canGoBack, canGoForward) {
    const backBtn = document.getElementById("back-button");
    const forwardBtn = document.getElementById("forward-button");

    if (backBtn) {
        backBtn.disabled = !canGoBack;
        backBtn.style.opacity = canGoBack ? "1" : "0.4";
        backBtn.style.cursor = canGoBack ? "pointer" : "not-allowed";
    }
    if (forwardBtn) {
        forwardBtn.disabled = !canGoForward;
        forwardBtn.style.opacity = canGoForward ? "1" : "0.4";
        forwardBtn.style.cursor = canGoForward ? "pointer" : "not-allowed";
    }
}

</script>
