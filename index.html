<!DOCTYPE html>
<html>
<!-- ====== index.html ====== -->
<head>
    <meta charset="UTF-8">
    <title></title>
</head>

<style>

:root {
    /* Fonds */
    --bg-main: #f3f4f6;
    --bg-toolbar: #ffffff;
    --bg-secondary: #f9fafb;

    /* Boutons */
    --button-bg: #f3f4f6;
    --button-hover: #e5e7eb;
    --button-border: #d1d5db;

    /* Texte */
    --text-primary: #1f2937;
    --text-secondary: #374151;

    /* Bordures */
    --border-color: #e5e7eb;

    /* Splitters */
    --splitter-bg: #d1d5db;
    --splitter-hover: #9ca3af;
}

html.dark {
    /* Fonds */
    --bg-main: #252526;
    --bg-toolbar: #252526;
    --bg-secondary: #252526;

    /* Boutons */
    --button-bg: #2d2d30;
    --button-hover: #3f3f46;
    --button-border: #3c3c3c;

    /* Texte */
    --text-primary: #cfcfcf;
    --text-secondary: #cfcfcf;

    /* Bordures */
    --border-color: #3c3c3c;

    /* Splitters */
    --splitter-bg: #4b5563;
    --splitter-hover: #6b7280;
}

/* =====================================================
   APPLICATION
===================================================== */

html,
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background: var(--bg-main);

    display: flex;
    flex-direction: column;

    transition: background .2s ease;
}

/* =====================================================
   BARRE D'OUTILS
===================================================== */

#toolbar-buttons {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-toolbar);
    
    /* Supprimez ou commentez cette ligne : */
    /* border-bottom: 1px solid var(--border-color); */

    padding: 4px 8px;
    padding-right: 140px;
    box-sizing: border-box;
    z-index: 99999;
    -webkit-app-region: drag;
}

#toolbar-buttons button,
#toolbar-buttons div {
    -webkit-app-region: no-drag;
}

/* =====================================================
   BOUTONS
===================================================== */

#toolbar-buttons button {
    width: 28px;
    height: 24px;

    background: var(--button-bg) !important;
    color: var(--text-primary) !important;

    border: 1px solid var(--button-border) !important;
    border-radius: 4px;

    cursor: pointer;
    font-weight: bold;

    transition: all .2s ease;
}

#toolbar-buttons button:hover:not(:disabled) {
    background: var(--button-hover) !important;
}

#toolbar-buttons button:focus {
    outline: none;
    box-shadow: none;
}

#toolbar-buttons button:disabled {
    opacity: .4;

    background: var(--button-bg) !important;
    color: #6b7280 !important;

    cursor: not-allowed;
}

/* =====================================================
   BARRE D'URL
===================================================== */

#url-bar {
    height: 28px;
    background: var(--bg-secondary);
    
    /* MODIFICATION ICI : On applique un gris très doux (#e5e7eb ou #f3f4f6) */
    border-bottom: 1px solid #e5e7eb !important;
    border-top: 1px solid #e5e7eb !important;

    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    position: fixed;
    top: 38px;
    width: 100%;
    box-sizing: border-box;
}



/* Style mis à jour pour la pastille incognito dans la barre d'adresse */
.incognito-badge {
    /* Couleurs par défaut pour le MODE CLAIR (Fond plus doux et lisible) */
    background: #f3e8ff; 
    color: #6b21a8;      
    border: 1px solid #d8b4fe;

    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 3px;
    margin-right: 6px;
    user-select: none;
    flex-shrink: 0;      
    display: flex;
    align-items: center;
    gap: 3px;
}

/* Surcharge automatique si le MODE SOMBRE est actif */
html.dark .incognito-badge {
    background: #4c1d95; 
    color: #c084fc;      
    border: 1px solid #6b21a8;
}

html.dark #url-bar {
    border-bottom: 1px solid #3c3c3c !important;
    border-top: 1px solid #3c3c3c !important;
}



.loading-spinner {
    display: inline-block;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   FAVORIS
===================================================== */

#bookmarks-bar {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-left: auto;

    height: 100%;
    padding: 0;

    background: transparent;
    border: none;

    flex-shrink: 0;
}

#bookmarks-list {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    max-width: 500px;
}

#clear-bookmarks-btn {
    width: 20px;
    height: 20px;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
}

.bookmarks-actions {
    display: flex;
    align-items: center;
    gap: 4px;
}


.bookmark-item {
    display: flex;
    align-items: center;

    padding: 2px 8px;

    max-width: 140px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: 11px;
    border-radius: 4px;
    cursor: pointer;
}


.bookmark-item:hover {
    background: var(--button-hover);
}

#close-bookmarks-bar {
    color: #6b7280;

    font-size: 11px;
    font-weight: bold;

    padding: 2px 6px;

    border-radius: 4px;

    cursor: pointer;

    transition: all .2s ease;
}

#close-bookmarks-bar:hover {
    background: #991b1b;
    color: #fca5a5;
}

/* À insérer dans votre bloc <style> ou à modifier si existant */
#bookmarks-list {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important; /* Permet de passer à la ligne suivante si la barre est pleine */
    gap: 6px !important;       /* Espace horizontal entre chaque favori */
    align-items: center;
}

</style>

<script>

let activePanel = null;
let currentPanels = []; // Stockage global pour maintenir la liste des panneaux
let currentMaximizedId = null; // Mémoire globale du mode zoom

// AJOUTEZ CETTE LIGNE ICI POUR QU'ELLE SOIT ACCESSIBLE PARTOUT :
let applicationDarkMode = false; 

// === LOGIQUE DE BASCULE DU MODE SOMBRE ===
let darkModeEnabled = false;

// === LOGIQUE DE BASCULE DU MODE SOMBRE ===
const darkModeBtn = document.getElementById("dark-mode-button");

if (darkModeBtn) {

    darkModeBtn.addEventListener("click", () => {

    console.log(
        "BUTTON CLICK",
        applicationDarkMode
    );

    setDarkMode(!applicationDarkMode);

});}

function refreshTabBorders() {
    const container = document.getElementById("url-bar");
    if (!container) return;

    const isDark = document.documentElement.classList.contains('dark');
    const tabs = container.children;
    for (let i = 0; i < tabs.length; i++) {
        const tabWrapper = tabs[i];
        const input = tabWrapper.querySelector("input");
        if (!input) continue;

        const panelId = input.id.replace("-url", "");

        if (activePanel && panelId === activePanel) {
            tabWrapper.style.borderColor = "#3b82f6";
            tabWrapper.style.background = isDark ? "#203a5d" : "#dbeafe";
        } else {
            tabWrapper.style.borderColor = isDark ? "#3c3c3c" : "#d1d5db";
            tabWrapper.style.background = isDark ? "#2d2d30" : "#f3f4f6";
        }
    }
}

function getDisplayUrl(url) {
    try {
        const parsedUrl = new URL(url);
        
        // === CORRECTIF : Masque l'IP du serveur de recherche privé ===
        if (parsedUrl.hostname === "129.151.254.175") {
            // Option A : Affiche simplement "Recherche"
            // return "Recherche";
            
            // Option B (alternative) : Si vous voulez afficher "Recherche : le mot clé"
               const queryParams = new URLSearchParams(parsedUrl.search);
               return "Recherche : " + (queryParams.get('q') || "");
        }
        
        // Comportement normal pour les autres sites (ex: google.com, github.com)
        return parsedUrl.hostname.replace(/^www\./, "");
    } catch {
        return url || "";
    }
}

function attachUrlHandler(panelId) {
    const input = document.getElementById(panelId + "-url");
    if (!input) return;

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            window.api.navigate(panelId, e.target.value);
        }
    });
}












function rebuildUrlBar(panels) {
    const urlBar = document.getElementById("url-bar");

    const isDark = applicationDarkMode;

    if (!urlBar || !Array.isArray(panels)) {
        return;
    }

    urlBar.innerHTML = "";

    panels.forEach((panel, index) => {
        const tabWrapper = document.createElement("div");
        tabWrapper.className = "url-tab";

        const isActive = activePanel === panel.id;

        // Style de base
        tabWrapper.style.display = "flex";
        tabWrapper.style.flexDirection = "row";
        tabWrapper.style.alignItems = "center";
        tabWrapper.style.gap = "6px";
        tabWrapper.style.flex = "1";
        tabWrapper.style.minWidth = "0";
        tabWrapper.style.padding = "2px 6px";
        tabWrapper.style.borderRadius = "6px";

        // Couleurs
        if (panel.isPrivate) {
            tabWrapper.style.background = isActive
                ? "#2a193d"
                : "#1e112c";
            tabWrapper.style.border = "1px solid #4a2874";
        } else {
            tabWrapper.style.background = isDark
                ? "#2d2d30"
                : "#f3f4f6";

            tabWrapper.style.border = isDark
                ? "1px solid #3c3c3c"
                : "1px solid #d1d5db";
        }

        if (isActive) {
            tabWrapper.style.boxShadow =
                "0 0 0 2px rgba(59,130,246,0.5)";
        }

        // Indicateur chargement
        const loadingIndicator = document.createElement("div");
        loadingIndicator.className = "loading-indicator";

        if (panel.isLoading) {
            loadingIndicator.innerHTML = "⏳";
        } else {
            loadingIndicator.innerHTML = panel.isPrivate ? "👤" : "🌐";
        }

        // Champ URL
        const input = document.createElement("input");
        input.type = "text";
        input.className = "url-input";
        input.value = panel.url || "";

        input.style.flex = "1";
        input.style.minWidth = "0";
        input.style.border = "none";
        input.style.outline = "none";
        input.style.background = "transparent";

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                navigateToUrl(index, input.value);
            }
        });

input.addEventListener("focus", () => {
    activePanel = panel.id;
});


        // Badge navigation privée
        if (panel.isPrivate) {
            const incognitoBadge = document.createElement("span");
            incognitoBadge.className = "incognito-badge";
            incognitoBadge.textContent = "👥";
            tabWrapper.appendChild(incognitoBadge);
        }

        // IMPORTANT : ajout une seule fois
        tabWrapper.appendChild(loadingIndicator);
        tabWrapper.appendChild(input);

        tabWrapper.addEventListener("click", (e) => {
            if (e.target !== input) {
                setActivePanel(index);
            }
        });

        urlBar.appendChild(tabWrapper);

        // --- BOUTON ÉTOILE DE FAVORI ---
        const starBtn = document.createElement("div");
        starBtn.className = "btn-favori";
        starBtn.id = `star-${panel.id}`;
        starBtn.innerText = "★"; 
        starBtn.title = "Ajouter aux favoris";

        starBtn.style.cursor = "pointer";
        starBtn.style.fontSize = "14px";
        starBtn.style.userSelect = "none";
        starBtn.style.color = "#6b7280"; 
        starBtn.style.zIndex = "20";
        
        // FORCE L'ÉTOILE À RESTER FIXE À DROITE
        starBtn.style.flex = "0 0 auto"; 
        starBtn.style.marginLeft = "8px";
        starBtn.style.display = "flex";
        starBtn.style.alignItems = "center";

        // SÉCURITÉ INCOGNITO : Si l'onglet est privé, on cache complètement l'étoile
        if (panel.isPrivate) {
            starBtn.style.display = "none"; // L'étoile disparait visuellement
            starBtn.style.cursor = "not-allowed";
            starBtn.title = "Les favoris sont désactivés en navigation privée";
            
            // Comportement normal UNIQUE pour les onglets publics
            starBtn.addEventListener("mousedown", (e) => e.stopPropagation());
            starBtn.addEventListener("click", async (e) => {
                e.stopPropagation();
                
                let targetPanelId = activePanel || panel.id; // Utilise le panneau de l'onglet si aucun n'est globalement actif
                
                const currentUrl = input.dataset.url || panel.url || "";
                const currentTitle = panel.title || input.value;
                const isAdded = await window.api.toggleFavori({ url: currentUrl, title: currentTitle });
                starBtn.innerText = isAdded ? "★" : "☆"; 
                starBtn.style.color = isAdded ? "#eab308" : "#6b7280"; 
            });
        } else {
            // Comportement normal UNIQUE pour les onglets publics
            starBtn.addEventListener("mousedown", (e) => e.stopPropagation());
            starBtn.addEventListener("click", async (e) => {
                e.stopPropagation();
                const currentUrl = input.dataset.url || panel.url || "";
                const currentTitle = panel.title || input.value;
                const isAdded = await window.api.toggleFavori({ url: currentUrl, title: currentTitle });
                starBtn.innerText = isAdded ? "★" : "★"; // Ajustez selon votre symbole souhaité
                starBtn.style.color = isAdded ? "#eab308" : "#6b7280"; 
            });
        }

        tabWrapper.appendChild(starBtn);

        // --- BARRE DE PROGRESSION ---
        const progBar = document.createElement("div");
        progBar.className = "download-progress-bar";
        progBar.id = `prog-${panel.id}`;

        tabWrapper.appendChild(progBar);

        urlBar.appendChild(tabWrapper);


        attachUrlHandler(panel.id);
    });
}

    // --- ÉCOUTEURS DES BOUTONS DE LA BARRE D'OUTILS ---
    document.getElementById("back-button").addEventListener("click", () => window.api.goBack(activePanel));
    document.getElementById("forward-button").addEventListener("click", () => window.api.goForward(activePanel));
    document.getElementById("refresh-button").addEventListener("click", () => window.api.refresh(activePanel));

    document.getElementById("save-config-btn")?.addEventListener("click", async () => {
        const success = await window.api.saveConfigToFile();
        if (success) {
            console.log("Configuration des panneaux exportée avec succès !");
        }
    });

    document.getElementById("load-config-btn")?.addEventListener("click", async () => {
        const success = await window.api.loadConfigFromFile();
        if (success) {
            console.log("Nouvelle configuration des panneaux chargée avec succès !");
        }
    });

// Dans index.html -> Écouteurs des boutons de scindage classique
    document.getElementById("split-vertical").addEventListener("click", () => {
        let targetPanelId = activePanel;

        // Sécurité : Si aucun panneau n'est actif, on prend le premier disponible
        if (!targetPanelId && currentPanels && currentPanels.length > 0) {
            targetPanelId = currentPanels[0].id;
        }

        if (targetPanelId) {
            window.api.splitPanel(targetPanelId, "vertical");
        }
    });

 // document.getElementById("split-horizontal").addEventListener("click", () => window.api.splitPanel(activePanel, "horizontal"));
    document.getElementById("split-horizontal").addEventListener("click", () => {
        let targetPanelId = activePanel;

        // Sécurité : Si aucun panneau n'est actif, on prend le premier disponible
        if (!targetPanelId && currentPanels && currentPanels.length > 0) {
            targetPanelId = currentPanels[0].id;
        }

        if (targetPanelId) {
            window.api.splitPanel(targetPanelId, "horizontal");
        }
    });
    
    document.getElementById("close-panel").addEventListener("click", () => window.api.closePanel(activePanel));
    document.getElementById("undo").addEventListener("click", () => window.api.undo());

/*
window.api.onSavePanelsShortcut(() => {
    console.log('Sauvegarde déclenchée');
});


window.api.onLoadPanelsShortcut(() => {
    console.log('Chargement déclenché');
}); 
*/

    window.api.onPanelsUpdated((panels, maximizedPanelId) => {

        currentPanels = panels;
        currentMaximizedId = maximizedPanelId;

        rebuildUrlBar(panels);

        updateMaximizedTabDisplay(maximizedPanelId);

        if (!window.initialThemeApplied) {

            window.initialThemeApplied = true;

            window.api.getThemePreference()
                .then(savedTheme => {
                    setDarkMode(savedTheme);
                });
        }

        const container = document.getElementById("url-bar");
        if (container) {
            if (maximizedPanelId) {
                container.classList.add("maximized-mode");
            } else {
                container.classList.remove("maximized-mode");
            }
        }

        // === FORCE LE VÉRIFICATION DES ÉTOILES À CHAQUE CHANGEMENT DE PAGE ===
        checkFavorisState();

        setTimeout(() => {
            if (document.activeElement instanceof HTMLInputElement) {
                document.activeElement.blur();
            }
        }, 0);
});

window.api.onUndoAvailable((available) => document.getElementById("undo").disabled = !available);

// Au clic sur la croix, on appelle la fonction du processus principal
document.getElementById("close-bookmarks-bar")?.addEventListener("click", () => {
    window.api.toggleBookmarksBarFromUI(); 
});

// Cet écouteur va recevoir la confirmation d'Electron et masquer la barre en CSS
window.api.onToggleBookmarksBar?.((isVisible) => {
    if (isVisible) {
        document.body.classList.remove("bookmarks-hidden");
    } else {
        document.body.classList.add("bookmarks-hidden");
    }
});

// === FONCTIONS GLOBALES POUR LA SYNCHRONISATION DES FAVORIS ===
async function checkFavorisState() {
    if (typeof currentPanels === 'undefined' || !currentPanels) return;
    
    // Récupération de la liste des favoris enregistrés sur le disque
    const favoris = await window.api.getFavoris?.() || [];
    
    currentPanels.forEach(panel => {
        const input = document.getElementById(`${panel.id}-url`);
        const starBtn = document.getElementById(`star-${panel.id}`);
        
        if (input && starBtn) {
            // Sécurité : Récupère l'URL brute associée au panneau
            const currentUrl = input.dataset.url || panel.realUrl || panel.url || "";
            
            // Comparaison propre des chaînes d'URLs
            const isFavori = favoris.some(f => f.url.trim() === currentUrl.trim());
            
            // Rendu visuel textuel sans caractères cassés
            starBtn.innerText = isFavori ? "★" : "☆";
            starBtn.style.color = isFavori ? "#eab308" : "#6b7280"; 
            starBtn.title = isFavori ? "Retirer des favoris" : "Ajouter aux favoris";
        }
    });
}

// 2. Écouteur pour intercepter le signal de mise à jour (ex: clic ou Ctrl+D)
window.api.onFavorisUpdated?.((favoris) => {
    checkFavorisState();
});

// === SÉCURISATION DU FOCUS DU PANNEAU ===
window.api.onFocusUrlBar?.((panelId) => {
    activePanel = panelId;
    refreshTabBorders();
    
    const input = document.getElementById(panelId + "-url");
    if (input) {
        setTimeout(() => {
            input.focus();
            input.setSelectionRange(0, input.value.length);
        }, 5);
    }
    
    // On demande à Electron de réactiver le liseré au focus de manière propre
    window.api.setActivePanel(panelId);
});

window.api.onActivePanelChanged((panel) => {
    if (!panel) return;
    activePanel = panel.id;
    refreshTabBorders();
    const frame = document.getElementById("active-panel-frame");
    if (frame && panel.bounds) {
        frame.style.display = "block";
        frame.style.left = panel.bounds.x + "px";
        frame.style.top = panel.bounds.y + "px";
        frame.style.width = panel.bounds.width + "px";
        frame.style.height = panel.bounds.height + "px";
    }
    const state = navigationStates[panel.id] || { canGoBack: false, canGoForward: false };
    updateToolbarButtons(state.canGoBack, state.canGoForward);
    updateCloseButtonState();
});

window.api.onNavigationState((state) => {
    document.getElementById("back-button").disabled = !state.canGoBack;
    document.getElementById("forward-button").disabled = !state.canGoForward;
});

const navigationStates = {};


window.api.onNavigationStateChanged((data) => {
    navigationStates[data.panelId] = {
        canGoBack: data.canGoBack,
        canGoForward: data.canGoForward
    };
    // Si le panneau qui vient de naviguer est bien le panneau actif, on met à jour les boutons
    if (activePanel === data.panelId) {
        updateToolbarButtons(data.canGoBack, data.canGoForward);
    }
});

function updateMaximizedTabDisplay(maximizedPanelId) {
    const container = document.getElementById("url-bar");
    if (!container) return;

    const tabs = container.children;

    for (const tab of tabs) {

        const input = tab.querySelector("input");
        if (!input) continue;

        const panelId = input.id.replace("-url", "");

        if (maximizedPanelId) {

            if (panelId === maximizedPanelId) {
                tab.style.display = "flex";
                tab.style.flex = "1";
            } else {
                tab.style.display = "none";
            }

        } else {

            tab.style.display = "flex";
            tab.style.flex = "1";
        }
    }
}

window.api.onZoomChanged((maximizedPanelId) => {

    currentMaximizedId = maximizedPanelId;

    updateMaximizedTabDisplay(maximizedPanelId);

    const container = document.getElementById("url-bar");

    if (!container) return;

    if (maximizedPanelId) {
        container.classList.add("maximized-mode");
    } else {
        container.classList.remove("maximized-mode");
    }
});

function updateCloseButtonState() {
    const closeBtn = document.getElementById("close-panel");
    if (!closeBtn) return;

    const selectedPanel = currentMaximizedId || activePanel;

    if (!selectedPanel) {
        closeBtn.disabled = true;
        closeBtn.style.cursor = "not-allowed";
        closeBtn.title = "Aucun panneau sélectionné";
    } else {
        closeBtn.disabled = false;
        closeBtn.style.cursor = "pointer";
        closeBtn.title = "Fermer le panneau actif";
    }
}

function updateToolbarButtons(canGoBack, canGoForward) {
    const backBtn = document.getElementById("back-button");
    const forwardBtn = document.getElementById("forward-button");

    if (backBtn) {
        backBtn.disabled = !canGoBack;
        backBtn.style.opacity = canGoBack ? "1" : "0.4";
        backBtn.style.cursor = canGoBack ? "pointer" : "not-allowed";
    }
    if (forwardBtn) {
        forwardBtn.disabled = !canGoForward;
        forwardBtn.style.opacity = canGoForward ? "1" : "0.4";
        forwardBtn.style.cursor = canGoForward ? "pointer" : "not-allowed";
    }
}

// --- ÉCOUTEURS DE TÉLÉCHARGEMENT SÉCURISÉS ---
window.api.onDownloadProgress((data) => {
    if (!data || !data.panelId) return;

    const progBar = document.getElementById(`prog-${data.panelId}`);
    const cancelBtn = document.getElementById(`cancel-dl-${data.panelId}`);
    const input = document.getElementById(`${data.panelId}-url`);
    
    if (progBar) {
        progBar.style.width = `${data.percent}%`;
    }
    if (cancelBtn) {
        cancelBtn.style.display = "flex";
    }
    if (input && document.activeElement !== input) {
        input.value = `📥 (${data.percent}%) ${data.filename}`;
        input.style.color = "#f97316"; 
    }
});

window.api.onDownloadDone((data) => {
    if (!data || !data.panelId) return;

    const progBar = document.getElementById(`prog-${data.panelId}`);
    const cancelBtn = document.getElementById(`cancel-dl-${data.panelId}`);

    if (progBar) progBar.style.width = "0%";
    if (cancelBtn) cancelBtn.style.display = "none";

    refreshTabBorders();

    if (typeof currentPanels !== 'undefined' && currentPanels) {
        const input = document.getElementById(`${data.panelId}-url`);
        const panelData = currentPanels.find(p => p.id === data.panelId);
        if (input && panelData) {
            input.value = getDisplayUrl(panelData.realUrl || panelData.url || "");
            input.style.color = "#d4d4d4";
        }
    }

    const container = document.getElementById("url-bar");
    if (container && currentMaximizedId) {
        container.classList.add("maximized-mode");
        const activeInput = document.getElementById(`${currentMaximizedId}-url`);
        if (activeInput && activeInput.parentElement) {
            activeInput.parentElement.classList.add("panel-is-maximized");
        }
    }
});

async function rebuildBookmarksBar() {
    const listContainer = document.getElementById("bookmarks-list");
    const clearBtn = document.getElementById("clear-bookmarks-btn");
    if (!listContainer) return;

    const isDark = applicationDarkMode; // Détecte le mode actif

    const favoris = await window.api.getFavoris?.() || [];
    listContainer.innerHTML = "";

    // Gestion de la visibilité du bouton
    if (clearBtn) {
        clearBtn.style.display = favoris.length === 0 ? "none" : "block";
        
        // --- COULEURS DYNAMIQUES DU BOUTON (CLAIR / SOMBRE) ---
        if (isDark) {
            clearBtn.style.background = "#374151";     // Gris foncé
            clearBtn.style.borderColor = "#4b5563";    // Bordure grise
            clearBtn.style.color = "#9ca3af";          // Texte gris clair
        } else {
            clearBtn.style.background = "#ffffff";     // Fond blanc
            clearBtn.style.borderColor = "#d1d5db";    // Bordure grise claire
            clearBtn.style.color = "#4b5563";          // Texte gris sombre
        }
    }

    if (favoris.length === 0) {
        const emptyText = document.createElement("span");
        emptyText.style.color = isDark ? "#6b7280" : "#9ca3af";
        emptyText.style.fontSize = "11px";
        emptyText.innerText = "Aucun favori enregistré. Cliquez sur l'étoile pour en ajouter.";
        listContainer.appendChild(emptyText);
        return;
    }

    favoris.forEach(fav => {
        const btn = document.createElement("div");
        btn.className = "bookmark-item";
        btn.innerText = "★ " + fav.title.replace("★ ", "").replace("☆ ", "");
        btn.title = fav.url;

        if (isDark) {
            btn.style.background = "#2d2d30";
            btn.style.borderColor = "#3c3c3c";
            btn.style.color = "#cfcfcf";
        } else {
            btn.style.background = "#ffffff";
            btn.style.borderColor = "#d1d5db";
            btn.style.color = "#1f2937";
        }


        // Effet de survol (hover) adaptatif pour la croix de fermeture des favoris
        const closeFavBtn = document.getElementById("close-bookmarks-bar");
        if (closeFavBtn) {
            closeFavBtn.addEventListener("mouseenter", () => {
                const isDark = applicationDarkMode;
                // Devient rouge au survol, selon le thème
                closeFavBtn.style.background = isDark ? "#991b1b" : "#fee2e2"; 
                closeFavBtn.style.color = isDark ? "#fca5a5" : "#b91c1c";
            });
            
            closeFavBtn.addEventListener("mouseleave", () => {
                const isDark = applicationDarkMode;
                // Reprend son état transparent et sa couleur neutre d'origine
                closeFavBtn.style.background = "transparent";
                closeFavBtn.style.color = isDark ? "#9ca3af" : "#4b5563";
            });
            }


        btn.addEventListener("mouseenter", () => {
            btn.style.background = isDark ? "#3f3f46" : "#f3f4f6";
            btn.style.color = isDark ? "#ffffff" : "#000000";
        });
        btn.addEventListener("mouseleave", () => {
            btn.style.background = isDark ? "#2d2d30" : "#ffffff";
            btn.style.color = isDark ? "#cfcfcf" : "#1f2937";
        });

btn.addEventListener("click", () => {
    let targetPanelId = activePanel;

    // SÉCURITÉ : Si aucun panneau n'est actif, on prend le premier disponible
    if (!targetPanelId && typeof currentPanels !== 'undefined' && currentPanels.length > 0) {
        targetPanelId = currentPanels[0].id;
    }

    if (targetPanelId) {
        window.api.navigate(targetPanelId, fav.url);
    } else {
        console.warn("Impossible d'ouvrir le favori : aucun panneau trouvé dans l'application.");
    }
});
        listContainer.appendChild(btn);
    });
}

// === METTRE À JOUR LES ÉCOUTEURS EXISTANTS POUR INCLURE LA BARRE ===

window.api.onFavorisUpdated?.((favoris) => {
    checkFavorisState();
    rebuildBookmarksBar(); // <-- AJOUTÉ ICI
});

// ===================================================
// LOGIQUE DE L'HISTORIQUE CORRIGÉE ET RÉORDONNÉE
// ===================================================

const historySidebar = document.getElementById("history-sidebar");
const historyContainer = document.getElementById("history-list-container");

// 1. Fonction pour ouvrir/fermer le volet
function toggleHistorySidebar() {
    if (!historySidebar) return;
    historySidebar.classList.toggle("open");

    if (historySidebar.classList.contains("open")) {
        renderHistory();
    }
}
async function renderHistory(historyList) {
    if (!window.api.getHistory) {
        console.error("L'API getHistory n'est pas définie dans preload.js");
        return;
    }

    if (!historyList) {
        historyList = await window.api.getHistory() || [];
    }
    
    historyContainer.innerHTML = "";
    
    if (historyList.length === 0) {
        historyContainer.innerHTML = '<span style="color: #6b7280; font-size: 11px; padding: 8px; display: block;">Aucun historique disponible.</span>';
        return;
    }
    
    historyList.forEach((item, index) => {
        // Conteneur principal de la ligne
        const div = document.createElement("div");
        div.className = "history-item";
        div.style.display = "flex";
        div.style.justify = "space-between";
        div.style.alignItems = "center";
        
        // Texte du lien
        const textSpan = document.createElement("span");
        textSpan.innerText = item.title || item.url;
        textSpan.title = `${item.title}\n${item.url}`;
        textSpan.style.overflow = "hidden";
        textSpan.style.textOverflow = "ellipsis";
        textSpan.style.flex = "1";
        
        textSpan.addEventListener("click", () => {
            if (activePanel) {
                window.api.navigate(activePanel, item.url);
                toggleHistorySidebar();
            }
        });
        
        // Bouton de suppression unique
        const deleteBtn = document.createElement("span");
        deleteBtn.innerHTML = "&#10006;"; // Code pour l'icône X
        deleteBtn.style.color = "#ef4444";
        deleteBtn.style.cursor = "pointer";
        deleteBtn.style.marginLeft = "8px";
        deleteBtn.style.padding = "2px 4px";
        deleteBtn.title = "Supprimer cet élément";
        
        deleteBtn.addEventListener("click", async (e) => {
            e.stopPropagation(); // Évite de déclencher le clic de navigation
            if (window.api.deleteHistoryItem) {
                const updated = await window.api.deleteHistoryItem(index);
                renderHistory(updated);
            }
        });
        
        div.appendChild(textSpan);
        div.appendChild(deleteBtn);
        historyContainer.appendChild(div);
    });
}

// 3. Écouteur pour le bouton de la barre d'outils
document.getElementById("history-button").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleHistorySidebar();
});

// 4. Écouteur pour le bouton de nettoyage
const clearHistoryBtn = document.getElementById("clear-history-btn");

if (clearHistoryBtn) {
    clearHistoryBtn.addEventListener("click", async () => {
        if (confirm("Voulez-vous vraiment effacer tout votre historique ?")) {
            if (window.api.clearHistory) {
                await window.api.clearHistory();
                renderHistory([]);
            }
        }
    });
}

// 5. Écoute les mises à jour en arrière-plan (La variable historySidebar est maintenant bien déclarée avant !)
window.api.onHistoryUpdated?.((updatedHistory) => {
    if (historySidebar && historySidebar.classList.contains("open")) {

    }
});

// 6. Gestion du raccourci clavier Ctrl+H depuis l'IHM

if (clearFavBtn) {
    clearFavBtn.addEventListener("mouseenter", () => {

window.api.onSystemThemeChanged((isDark) => {

    applicationDarkMode = isDark;

    document.documentElement.classList.toggle("dark", isDark);
    document.body.classList.toggle("dark", isDark);

    const darkModeBtn =
    document.getElementById("dark-mode-button");

    if (darkModeBtn) {
        darkModeBtn.innerText = isDark ? "☀️" : "🌙";
    }

    rebuildUrlBar(currentPanels);
    rebuildBookmarksBar();
});

updateCloseButtonState();

function updateUrlBarTheme() {
    const urlBarContainer = document.getElementById("url-bar");
    if (urlBarContainer) {
        urlBarContainer.style.background = applicationDarkMode ? "#252526" : "#f9fafb";
        
        // Applique la couleur de bordure sombre ou claire sur les deux côtés simultanément
        const borderColor = applicationDarkMode ? "#3c3c3c" : "#e5e7eb";
        urlBarContainer.style.borderBottomColor = borderColor;
        urlBarContainer.style.borderTopColor = borderColor;
    }
}


function setDarkMode(enabled) {

    applicationDarkMode = enabled;

    console.log(
    "setDarkMode(",
    enabled,
    ")"
);

    window.api.saveThemePreference(enabled);
    window.api.toggleDarkMode(enabled);

    document.documentElement.classList.toggle(
        "dark",
        enabled
    );

    document.body.classList.toggle(
        "dark",
        enabled
    );

    const darkModeBtn =
        document.getElementById("dark-mode-button");

    if (darkModeBtn) {
        darkModeBtn.innerText =
            enabled ? "☀️" : "🌙";

        darkModeBtn.title =
            enabled
                ? "Désactiver le mode sombre"
                : "Activer le mode sombre";
    }

    rebuildUrlBar(currentPanels);

    if (typeof rebuildBookmarksBar === "function") {
        rebuildBookmarksBar();
    }
}

function applyTheme() {

    document.documentElement.classList.toggle(
        "dark",
        applicationDarkMode
    );

    document.body.classList.toggle(
        "dark",
        applicationDarkMode
    );

    const darkModeBtn =
        document.getElementById("dark-mode-button");

    if (darkModeBtn) {
        darkModeBtn.innerText =
            applicationDarkMode ? "☀️" : "🌙";
    }
}
