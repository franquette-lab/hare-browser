<!DOCTYPE html>
<html>
<!-- ====== index.html ====== -->
 <!-- Tout en haut de la balise <head> dans index.html -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: http://127.0.0.1:11434; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>

<style>

:root {
    color-scheme: light;
    /* Fonds */
    --bg-main: #f3f4f6;
    --bg-toolbar: #ffffff;
    --bg-secondary: #f9fafb;

    /* Boutons */
    --button-bg: #f3f4f6;
    --button-hover: #e5e7eb;
    --button-border: #d1d5db;

    /* Texte */
    --text-primary: #1f2937;
    --text-secondary: #374151;

    /* Bordures */
    --border-color: #e5e7eb;

    /* Splitters */
    --splitter-bg: #d1d5db;
    --splitter-hover: #9ca3af;
}

html.dark {
    color-scheme: dark;
    /* Fonds */
    --bg-main: #252526;
    --bg-toolbar: #252526;
    --bg-secondary: #252526;

    /* Boutons */
    --button-bg: #2d2d30;
    --button-hover: #3f3f46;
    --button-border: #3c3c3c;

    /* Texte */
    --text-primary: #cfcfcf;
    --text-secondary: #cfcfcf;

    /* Bordures */
    --border-color: #3c3c3c;

    /* Splitters */
    --splitter-bg: #4b5563;
    --splitter-hover: #6b7280;
}

/* =====================================================
   APPLICATION
===================================================== */

html,
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background: var(--bg-main);

    display: flex;
    flex-direction: column;

    transition: background .2s ease;
}

/* =====================================================
   BARRE D'OUTILS
===================================================== */

#toolbar-buttons {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-toolbar);
    
    /* Supprimez ou commentez cette ligne : */
    /* border-bottom: 1px solid var(--border-color); */

    padding: 6px 10px;
    padding-right: 140px;
    box-sizing: border-box;
    z-index: 99999;
    -webkit-app-region: drag;
    transition: transform .22s ease, opacity .22s ease;
}

#fullscreen-reveal-zone {
    display: none;
}

body.fullscreen-toolbar-hidden #toolbar-buttons,
body.fullscreen-toolbar-hidden #url-bar,
body.fullscreen-toolbar-hidden #find-in-page-bar {
    opacity: 0;
    pointer-events: none;
}

body.fullscreen-toolbar-hidden #toolbar-buttons {
    transform: translateY(-100%);
}

body.fullscreen-toolbar-hidden #url-bar {
    transform: translateY(-200%);
}

body.fullscreen-toolbar-active #toolbar-buttons,
body.fullscreen-toolbar-active #url-bar,
body.fullscreen-toolbar-active #find-in-page-bar {
    opacity: 1;
    pointer-events: auto;
    transition: transform .22s ease, opacity .22s ease;
}

body.fullscreen-toolbar-active #toolbar-buttons,
body.fullscreen-toolbar-active #url-bar {
    transform: translateY(0);
}

body.fullscreen-toolbar-hidden #find-in-page-bar { transform: translateY(-200%); }
body.fullscreen-toolbar-active #find-in-page-bar { transform: translateY(0); }

body.fullscreen-toolbar-hidden #fullscreen-reveal-zone {
    display: block;
    position: fixed;
    inset: 0 0 auto;
    height: 8px;
    z-index: 2147483647;
    -webkit-app-region: no-drag;
}

#toolbar-buttons button,
#toolbar-buttons div {
    -webkit-app-region: no-drag;
}

.toolbar-button:disabled {
    opacity: 0.4;
    cursor: default;
    pointer-events: none;
}

.loading-spinner {
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   BOUTONS
===================================================== */

#toolbar-buttons button {
    width: 34px !important;
    height: 30px !important;
    min-width: 34px;
    min-height: 30px;

    background: var(--button-bg) !important;
    color: var(--text-primary) !important;

    border: 1px solid var(--button-border) !important;
    border-radius: 6px;

    cursor: pointer;
    font-weight: bold;
    font-size: 16px !important;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;

    transition: all .2s ease;
}

#toolbar-buttons button:hover:not(:disabled) {
    background: var(--button-hover) !important;
}

#toolbar-buttons button:focus {
    outline: none;
    box-shadow: none;
}

#toolbar-buttons button:disabled {
    opacity: .4;

    background: var(--button-bg) !important;
    color: #6b7280 !important;

    cursor: not-allowed;
}

/* =====================================================
   BARRE D'URL
===================================================== */

.url-bar-container {
    display: flex;
    align-items: center;
    position: relative;
    background: var(--bg-secondary);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 4px 8px;
}

.url-icon {
    margin-right: 8px;
    font-size: 14px;
    user-select: none;
}


#url-bar {
    /* La zone URL arrive exactement au début des BrowserViews (TOOLBAR_HEIGHT = 76px). */
    height: 38px !important;
    background: linear-gradient(to bottom, rgba(255,255,255,0.08), var(--bg-secondary));
    border-bottom: 1px solid #e5e7eb !important;
    border-top: 1px solid rgba(59, 130, 246, 0.65) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 0 0 1px rgba(15, 23, 42, 0.08);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    position: fixed;
    top: 38px;
    width: 100%;
    box-sizing: border-box;
}

#url-bar::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 3px;
    background: linear-gradient(90deg, #ff4d4d 0%, #f59e0b 22%, #3b82f6 50%, #10b981 75%, #8b5cf6 100%);
    box-shadow: 0 0 6px rgba(59, 130, 246, 0.6);
}

#find-in-page-bar {
    position: fixed;
    top: 42px;
    right: 12px;
    z-index: 2147483646;
    display: none;
    align-items: center;
    gap: 5px;
    width: 330px;
    height: 32px;
    padding: 3px 5px;
    box-sizing: border-box;
    color: var(--text-primary);
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .25);
    -webkit-app-region: no-drag;
}

#find-in-page-bar.open { display: flex; }

#find-in-page-input {
    flex: 1;
    min-width: 0;
    height: 22px;
    padding: 0 5px;
    color: var(--text-primary);
    background: transparent;
    border: 0;
    outline: 0;
    font: 12px "Segoe UI", sans-serif;
}

#find-in-page-count {
    min-width: 38px;
    color: var(--text-secondary);
    text-align: center;
    font: 11px "Segoe UI", sans-serif;
    white-space: nowrap;
}

#find-in-page-bar button {
    width: 24px;
    height: 23px;
    padding: 0;
    color: var(--text-primary);
    background: var(--button-bg);
    border: 1px solid var(--button-border);
    border-radius: 4px;
    cursor: pointer;
    line-height: 1;
}

#find-in-page-bar button:hover { background: var(--button-hover); }

.url-tab {
    position: relative;
    padding: 0px 6px !important; /* Supprime le padding vertical (haut/bas) pour aplatir l'onglet */
    height: 30px !important;
    box-sizing: border-box;
    border: 1px solid transparent;
}

/* Barre de progression de téléchargement au bas de l'onglet */
.download-progress-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 0;
    background: #f97316;
    border-radius: 0 2px 2px 0;
    transition: width .25s linear;
    pointer-events: none;
}

.url-tab.active-url-tab {
    border: 1px solid #3b82f6 !important;
    border-top: 3px solid #3b82f6 !important;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.35), 0 -2px 0 rgba(59, 130, 246, 0.8) !important;
}

.url-tab.private-url-tab.active-url-tab {
    border-color: #7e22ce !important;
    border-top-color: #7e22ce !important;
    box-shadow: 0 0 0 2px rgba(126, 34, 206, 0.35), 0 -2px 0 rgba(126, 34, 206, 0.8) !important;
}

.url-input {
    color: #111827;
    height: 18px !important;
    font-size: 14px !important; /* Optionnel : réduit légèrement la police si le texte est coupé */
    font-Weight: 500;
    cursor: text;
}


.dark .url-input {
    color: #ffffff;
}

/* Style mis à jour pour la pastille incognito dans la barre d'adresse */
.incognito-badge {
    /* Couleurs par défaut pour le MODE CLAIR (Fond plus doux et lisible) */
    background: #f3e8ff; 
    color: #6b21a8;      
    border: 1px solid #d8b4fe;

    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 3px;
    margin-right: 6px;
    user-select: none;
    flex-shrink: 0;      
    display: flex;
    align-items: center;
    gap: 3px;
}

/* Surcharge automatique si le MODE SOMBRE est actif */
html.dark .incognito-badge {
    background: #4c1d95; 
    color: #c084fc;      
    border: 1px solid #6b21a8;
}

html.dark #url-bar {
    border-bottom: 1px solid #3c3c3c !important;
    border-top: 1px solid #3c3c3c !important;
}



.loading-spinner {
    display: inline-block;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   FAVORIS
===================================================== */

#bookmarks-bar {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-left: auto;

    height: 30px;
    padding: 4px 8px;

    background: rgba(15, 23, 42, 0.12);
    border: 1px solid rgba(15, 23, 42, 0.35);
    border-radius: 8px;
    box-sizing: border-box;

    flex-shrink: 0;
}

#bookmarks-list {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    gap: 6px !important;
    align-items: center;
    height: 28px;
    padding: 2px 4px;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 6px;
    border: 1px solid rgba(15, 23, 42, 0.18);
    background: rgba(255, 255, 255, 0.08);
}

#clear-bookmarks-btn {
    width: 20px;
    height: 20px;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
}

.bookmarks-actions {
    display: flex;
    align-items: center;
    gap: 4px;
}


.bookmark-item {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 20px;
    padding: 4px 10px !important;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    border-radius: 6px !important;
    cursor: pointer;
    transition: all .2s ease;
    
    /* Couleurs par défaut (Mode Clair) */
    background: #ffffff !important;
    border: 1px solid #d1d5db !important;
    color: #1f2937 !important;
    box-shadow: inset 0 0 0 1px rgba(17, 24, 39, 0.04);
}


.bookmark-item:hover {
    background: var(--button-hover) !important;
    color: #000000 !important;
}

html.dark .bookmark-item {
    background: #2d2d30 !important;
    border: 1px solid #3c3c3c !important;
    color: #cfcfcf !important;
}

html.dark .bookmark-item:hover {
    background: #3f3f46 !important;
    color: #ffffff !important;
}

html.dark #bookmarks-bar {
    background: rgba(255, 255, 255, 0.06);
    border-color: #3c3c3c;
}

html.dark #bookmarks-list {
    background: #252526;
    border-color: #3c3c3c;
}

html.dark #pwd-modal {
    background: #252526 !important;
    border-color: #3c3c3c !important;
    color: #cfcfcf !important;
}

#close-bookmarks-bar {
    color: #6b7280;

    font-size: 11px;
    font-weight: bold;

    padding: 2px 6px;

    border-radius: 4px;

    cursor: pointer;

    transition: all .2s ease;
}

#close-bookmarks-bar:hover {
    background: #991b1b;
    color: #fca5a5;
}



/* =================================================== */
/* DESIGN DE L'ASSISTANT IA DYNAMIQUE CLAIR / SOMBRE  */
/* =================================================== */


/* Classe de chargement asynchrone pour le bouton Résumer */
.btn-analyzing {
    pointer-events: none !important; /* Évite les clics multiples */
    cursor: not-allowed !important;
    animation: pulse-loading 1.2s infinite ease-in-out !important;
    will-change: transform, opacity, box-shadow;
}

@keyframes quick-fade {
    0%   { opacity: 1.0; }
    50%  { opacity: 0.4; }
    100% { opacity: 1.0; }
}


/* Définition de l'animation de pulsation fluide */
@keyframes pulse-loading {
    0% {
        transform: scale(1);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(21, 128, 61, 0.4);
    }
    50% {
        transform: scale(0.97);
        opacity: 0.7;
        box-shadow: 0 0 10px 4px rgba(21, 128, 61, 0.2);
    }
    100% {
        transform: scale(1);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(21, 128, 61, 0);
    }
}


/* 1. Thème CLAIR par défaut (Textes bien foncés) */
.ai-sidebar-native {
    background: #f3f4f6 !important;
    color: #111827 !important; /* Texte de base très foncé */
    border-left-color: #cbd5e1 !important;
}
.ai-sidebar-native .ai-title-text {
    color: #111827 !important; /* TITRE EN NOIR FONCÉ SURCHARGÉ */
}
.ai-sidebar-native #ai-response-container {
    color: #6b7280 !important; /* Descriptif en gris*/
    line-height: 1.2 !important;
}
/* Forçage de l'encadré du bas en gris clair (plus de rectangle noir) */
.ai-sidebar-native .ai-footer-box {
    background: #e5e7eb !important; /* Fond gris clair */
    border: 1px solid #cbd5e1 !important;
}
.ai-sidebar-native #ai-user-prompt {
    background: #ffffff !important;
    color: #000000 !important;
    border-color: #cbd5e1 !important;
}



/* 2. Thème SOMBRE automatique (Dès que la classe est activée) */
.ai-sidebar-native.dark-mode-active {
    background: #1e1e1e !important;
    color: #cfcfcf !important;
    border-left-color: #3c3c3c !important;
}
.ai-sidebar-native.dark-mode-active .ai-title-text {
    color: #ffffff !important;
}
.ai-sidebar-native.dark-mode-active #ai-response-container {
    color: #e2e8f0 !important;
}
/* Encadré du bas en noir/anthracite en mode sombre */
.ai-sidebar-native.dark-mode-active .ai-footer-box {
    background: #18181b !important;
    border: 1px solid #27272a !important;
}
.ai-sidebar-native.dark-mode-active #ai-user-prompt {
    background: #2d2d30 !important;
    color: #ffffff !important;
    border-color: #3c3c3c !important;
}
.ai-sidebar-native.dark-mode-active .ai-alert-badge {
    background: rgba(239, 68, 68, 0.1) !important;
    border: 1px solid rgba(239, 68, 68, 0.2) !important;
    color: #f87171 !important;
}

.hourglass-anim {
    display: inline-block;
    animation: hourglass-flip 1.6s ease-in-out infinite;
}

@keyframes hourglass-flip {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(180deg); }
}

.btn-split:hover {
    color: #4ade80;
    transform: scale(1.2);
}



</style>

<body class="m-0 flex items-center justify-center bg-gray-100 dark:bg-zinc-900 min-h-screen">

<div id="fullscreen-reveal-zone" aria-hidden="true"></div>


<!-- ====== DANS INDEX.HTML -> BARRE D'OUTILS SÉCURISÉE AVEC ICÔNES COMPATIBLES ====== -->
<div id="toolbar-buttons" class="fixed top-0 left-0 right-0 z-50">
   
    <button id="back-button" title="Revenir (Alt+Flêche gauche)" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">&#9664;</button>
   
    <button id="forward-button" title="Avancer (Alt+Flêche droite)" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">&#9654;</button>
    
    <button id="refresh-button" title="Actualiser (Ctrl+R ou F5)" style="width:28px; height:24px; background:#2d2d30; color:#d4d4d4; border:1px solid #3c3c3c; font-size:14px; cursor:pointer;">&#8635;</button>
    
    <!-- AJOUT ICI : Le bouton Mode Sombre -->
    <button id="dark-mode-button" title="Activer le mode sombre" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">🌙</button>

    <!-- L'attribut onclick appelle directement notre nouveau pont preload de manière brute -->
    <button id="history-button" title="Historique (Ctrl+H)" onclick="window.api.openHistoryWindow()" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; font-weight:bold; cursor:pointer; position:relative; z-index:999999 !important;">🕒</button>

    <button id="downloads-button" title="Téléchargements (Ctrl+J)" onclick="window.api.openDownloadsWindow()" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">⬇️</button>

    <button id="reader-mode-button" title="Mode lecture : affiche la page sans distractions" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">👓</button>

    <!-- Bouton Gestionnaire de mots de passe -->
    <button id="pwd-manager-btn" title="Gestionnaire de mots de passe" style="width:28px; height:24px; background:#2d2d30; color:#fbbf24; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">🔑</button>

    <!-- À insérer dans votre bloc #toolbar-buttons (par exemple à côté de votre bouton d'impression ou d'historique) -->
    <button id="save-config-btn" title="Sauver la configuration des panneaux (Ctrl+S)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">💾</button>
   
    <button id="load-config-btn" title="Charger une configuration des panneaux (Ctrl+O)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">📂</button>

    <!-- À placer dans votre div #toolbar-buttons (par exemple juste avant le bouton de fermeture "close-panel") -->
    <button id="print-button" title="Imprimer le panneau actif (Ctrl+P)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:12px; cursor:pointer;">🖨️</button>

    <!-- Remplacement dans la barre d'outils de index.html -->

    <button id="split-container" title="Scinder dans un conteneur isolé (comptes multiples)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:13px; cursor:pointer;">🗂️</button>

    <!-- Ajoutez le bouton dans votre conteneur de boutons existant -->

    <button id="auto-sleep-toggle" type="button" aria-pressed="true" title="Veille automatique activée : les tuiles inactives sont mises en veille après 15 minutes">💤</button>

    <button id="duplicate-panel" title="Dupliquer cette tuile (Ctrl+Shift+D)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:13px; cursor:pointer;">📋</button>

    <!-- Scindage vertical : Deux barres verticales simples -->
    <button id="split-vertical" title="Scinder à droite (Ctrl+T)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:11px; font-weight:bold; cursor:pointer;">|</button>
    
    <!-- Scindage horizontal : Une barre horizontale simple -->
    <button id="split-horizontal" title="Scinder vers le bas (Ctrl+H)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:11px; font-weight:bold; cursor:pointer;">&mdash;</button>   

    <!-- Dans index.html -> Dans la div #toolbar-buttons -->
    <button id="ai-sidebar-button" title="Demander à l'IA Ollama" style="width:28px; height:24px; background:#2d2d30; color:#4ade80; border:1px solid #3c3c3c; font-size:12px; font-weight:bold; cursor:pointer;">✨</button>

    <!-- Bouton aidr -->
    <button id="help-btn" title="Aide de Hare Browser (F1)" style=" width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:11px; cursor:pointer;">❓</button>

    <!-- Bouton Undo d'annulation -->

    <!-- Bouton Fermeture du panneau -->
    <button id="close-panel" title="Fermer le panneau actif (Ctrl+W)" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:11px; cursor:pointer;">✕</button>

    <button id="fullscreen-toggle-button" title="Activer le plein écran (F11)" aria-label="Activer le plein écran" style="width:28px; height:24px; background:#2d2d30; color:#cfcfcf; border:1px solid #3c3c3c; font-size:17px; cursor:pointer;">⛶</button>

    <div id="bookmarks-bar">
        <div id="bookmarks-list"></div>

<script>

let activePanel = null;
let currentPanels = []; // Stockage global pour maintenir la liste des panneaux
let currentMaximizedId = null; // Mémoire globale du mode zoom

        // Assurez-vous que ce code s'exécute une fois le DOM chargé
        document.addEventListener("DOMContentLoaded", () => {

            const urlIcon = document.getElementById('url-icon');

            function checkSearchOrUrl(input) {
                input = input.trim();
                if (input === "") return "🌐";

                if (input.includes("://") || input.startsWith("data:") || input.startsWith("about:")) {
                    return "🌐";
                }

                // Note : Correction de l'expression régulière (le \$ final empêchait la détection à la saisie)
                const domainRegex = /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+(:[0-9]+)?(\/.*)?$/;
                if (domainRegex.test(input) && !input.includes(" ")) {
                    return "🌐";
                }

                return "🔍";
            }

            if (urlInput && urlIcon) {
                urlInput.addEventListener('input', (e) => {
                    urlIcon.textContent = checkSearchOrUrl(e.target.value);
                });
            }
        });

// === LOGIQUE DE BASCULE DU MODE SOMBRE ===
const darkModeBtn = document.getElementById("dark-mode-button");

if (darkModeBtn) {

/*

function refreshTabBorders() {
    const container = document.getElementById("url-bar");
    if (!container) return;

    const isDark = document.documentElement.classList.contains('dark');
    const tabs = container.children;
    for (let i = 0; i < tabs.length; i++) {
        const tabWrapper = tabs[i];


        const input = tabWrapper.querySelector("input");

        if (!input) continue;

        // panelId lu depuis l'input existant : on ne touche pas à l'id ni aux
        // écouteurs (sinon reconstruction / perte de sélection).
        const panelId = input.id.replace("-url", "");
        const isActiveTab = !!(activePanel && panelId === activePanel);
        const isPrivateTab = !!tabWrapper.querySelector(".incognito-badge");
        tabWrapper.classList.toggle("active-url-tab", isActiveTab);
        tabWrapper.classList.toggle("private-url-tab", isPrivateTab);

        if (isPrivateTab) {
            tabWrapper.style.background = isDark
                ? (isActiveTab ? "#2a193d" : "#1e112c")
                : (isActiveTab ? "#ede9fe" : "#f5f3ff");
            tabWrapper.style.borderColor = isActiveTab
                ? (isDark ? "#a855f7" : "#7e22ce")
                : (isDark ? "#4a2874" : "#c4b5fd");
            tabWrapper.style.borderWidth = isActiveTab ? "2px" : "1px";
        } else if (isActiveTab) {
            tabWrapper.style.borderColor = "#3b82f6";
            tabWrapper.style.background = isDark ? "#203a5d" : "#dbeafe";
            tabWrapper.style.borderWidth = "2px";
        } else {
            tabWrapper.style.borderColor = isDark ? "#3c3c3c" : "#d1d5db";
            tabWrapper.style.background = isDark
                ? "#3a3a3f"
                : "#f3f4f6";
            tabWrapper.style.borderWidth = "1px";
        }

        tabWrapper.style.boxShadow = isActiveTab
            ? (isPrivateTab
                ? "0 0 0 2px rgba(126,34,206,0.35)"
                : "0 0 0 2px rgba(59,130,246,0.5)")
            : "none";


    }
}

function getUrlTypeIcon(url, isPrivate = false) {

    // Pas d'icône supplémentaire en navigation privée
    if (isPrivate) {
        return "";
    }

    if (!url) return "🌐";

    try {

        const parsed = new URL(url);

        if (
            parsed.hostname.includes("google") &&
            parsed.pathname === "/search"
        ) {
            return "🔍";
        }

        if (parsed.pathname.includes("/search")) {
            return "🔍";
        }

        return "🌐";

    } catch {

        return "🔍";

    }
}
function isSearchResultsUrl(url) {
    try {
        const parsedUrl = new URL(url);
        return parsedUrl.hostname === "129.151.254.175" ||
            parsedUrl.pathname === "/search" ||
            parsedUrl.pathname.endsWith("/search");
    } catch {
        return false;
    }
}

function getSearchQueryFromUrl(url, fallbackQuery = "") {
    try {
        const parsedUrl = new URL(url);
        return parsedUrl.searchParams.get("q") || fallbackQuery || null;
    } catch {
        return fallbackQuery || null;
    }
}

function getDisplayUrl(url, fallbackQuery = "") {
    try {
        const parsedUrl = new URL(url);
        if (parsedUrl.protocol === "file:") {
            const localPage = parsedUrl.pathname.toLowerCase();
            if (localPage.endsWith("/help.html")) return "Aide";
            if (localPage.endsWith("/home.html")) return "Accueil";
            if (localPage.endsWith("/welcome.html")) return "Bienvenue";
        }
        const searchQuery = isSearchResultsUrl(url)
            ? getSearchQueryFromUrl(url, fallbackQuery)
            : null;
        if (searchQuery !== null) return `${searchQuery} - Recherche ${applicationTitle}`;

        if (parsedUrl.hostname === "129.151.254.175") {
            return `Moteur de recherche ${applicationTitle}`;
        }

        // Comportement normal pour les autres sites (ex: github.com)
        return parsedUrl.hostname.replace(/^www\./, "");
    } catch {
        return url || "";
    }
}

function isFavoriteAllowedUrl(url) {
    try {
        const parsedUrl = new URL(url);
        if (parsedUrl.protocol !== "file:") return true;
        const pageName = decodeURIComponent(parsedUrl.pathname).split("/").pop().toLowerCase();
        return !["welcome.html", "home.html", "help.html"].includes(pageName);
    } catch {
        return true;
    }
}


// 1. Gestionnaire de saisie d'URL corrigé
function attachUrlHandler(panelId) {
    const input = document.getElementById(panelId + "-url");
    if (!input) return;

    // Ne pas cloner l'input : cloneNode supprime les écouteurs déjà posés
    // (sélection au clic, expansion de l'URL au focus). rebuildUrlBar crée
    // déjà un nouvel input à chaque reconstruction, donc pas de doublon ici.

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            if (input.readOnly) {
                e.preventDefault();
                return;
            }
            e.preventDefault();
            const valeureSaisie = input.value.trim();
            if (valeureSaisie) {
                console.log("Navigation demandée pour le panneau " + panelId + " vers : " + valeureSaisie);
                const isSearchQuery =
                    !valeureSaisie.includes("://") &&
                    !valeureSaisie.startsWith("data:") &&
                    !valeureSaisie.startsWith("about:") &&
                    !/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+(\:[0-9]+)?(\/.*)?$/.test(valeureSaisie);
                window.api.navigate(panelId, valeureSaisie);
                input.blur();
                if (isSearchQuery) {
                    input.value = `${valeureSaisie} - Recherche ${applicationTitle}`;
                }
            }
        }
    });

    input.addEventListener("mousedown", (e) => {
        const tabWrapper = input.closest(".url-tab") || input.parentElement;
        if (tabWrapper) tabWrapper.setAttribute("draggable", "false");
    });
    
    input.addEventListener("click", (e) => {
        e.stopPropagation();
        if (activePanel !== panelId) {
            window.api.setActivePanel(panelId, { keepChromeFocus: true });
        }
    });
}

// 2. L'unique écouteur de mise à jour des panneaux global
window.api.onPanelsUpdated((panelsList, zoomPanelId) => {
    // 1. Log d'IHM sécurisé
    console.log("Mise à jour des panneaux reçue par l'IHM.");
    
    // ✨ AJOUT : Griser ou activer le bouton de la barre de navigation
    const equalizeBtn = document.getElementById('btn-equalize-mosaic');
    if (equalizeBtn) {
        if (panelsList && panelsList.length <= 1) {
            // S'il n'y a qu'une tuile (ou moins), on applique l'attribut HTML "disabled"
            equalizeBtn.disabled = true;
            equalizeBtn.style.opacity = "0.4"; // Optionnel : retour visuel semi-transparent
            equalizeBtn.style.cursor = "not-allowed";
        } else {
            // Dès qu'un deuxième panneau s'ouvre, on réactive le bouton
            equalizeBtn.disabled = false;
            equalizeBtn.style.opacity = "1";
            equalizeBtn.style.cursor = "pointer";
        }
    }


    // 2. Assignation sécurisée aux variables globales sans jamais écrire le mot "panel" au singulier
    currentPanels = Array.isArray(panelsList) ? panelsList : [];
    currentMaximizedId = zoomPanelId || null;
    updateReaderModeButtons();

    // 3. Exécution compartimentée pour isoler et identifier les bugs
    // Ne pas reconstruire la barre si l'utilisateur édite une URL : set-active-panel
    // envoie panels-updated et innerHTML = "" détruirait l'input (flash URL complète).
    const focusedElement = document.activeElement;

    const wasUrlInput =
        focusedElement &&
        focusedElement.classList &&
        focusedElement.classList.contains("url-input");

    try {
        const urlBar = document.getElementById("url-bar");
        const existingIds = urlBar
            ? Array.from(urlBar.querySelectorAll(".url-input"), input => input.id.replace(/-url$/, ""))
            : [];
        const nextIds = currentPanels.map(panel => panel.id);
        const structureChanged =
            existingIds.length !== nextIds.length ||
            existingIds.some((id, index) => id !== nextIds[index]);

        if (structureChanged) {
            if (typeof rebuildUrlBar === "function") rebuildUrlBar(currentPanels);
            if (typeof refreshTabBorders === "function") refreshTabBorders();
        } else if (urlBar) {
            currentPanels.forEach(panel => {
                const input = document.getElementById(`${panel.id}-url`);
                if (!input) return;

                const url = panel.realUrl || panel.url || "";
                if (input.dataset.url !== url) input.dataset.url = url;
                input.readOnly = !!panel.isPrivate || isSearchResultsUrl(url);
                input.style.cursor = input.readOnly ? "default" : "text";
                const adBlockButton = input.parentElement.querySelector(".adblock-toggle");
                if (adBlockButton) {
                    const host = getAdBlockHost(url);
                    adBlockButton.dataset.host = host;
                    adBlockButton.style.display = host ? "inline-flex" : "none";
                }
                const starBtn = document.getElementById(`star-${panel.id}`);
                if (starBtn) {
                    starBtn.style.display = panel.isPrivate || !isFavoriteAllowedUrl(url) ? "none" : "flex";
                }
                if (input.readOnly || !wasUrlInput || document.activeElement !== input) {
                    const displayUrl = typeof getDisplayUrl === "function" ? getDisplayUrl(url, panel.searchQuery) : url;
                    if (input.value !== displayUrl) input.value = displayUrl;
                }

                const icon = input.parentElement.querySelector("span:not(.loading-spinner):not(.incognito-badge)");
                if (icon) {
                    const iconText = getUrlTypeIcon(url, panel.isPrivate);
                    if (icon.textContent !== iconText) icon.textContent = iconText;
                }
            });
            updateAdblockButtons();
            if (typeof refreshTabBorders === "function") refreshTabBorders();
        }
    } catch (err) {
        console.error("Erreur dans rebuildUrlBar lors du rafraîchissement :", err);
    }

    try {
        if (typeof updateMaximizedTabDisplay === "function") {
            updateMaximizedTabDisplay(currentMaximizedId);
        }
    } catch (err) {
        console.error("Erreur dans updateMaximizedTabDisplay :", err);
    }

    // 4. Mise à jour des styles CSS du conteneur global
    const container = document.getElementById("url-bar");
    if (container) {
        if (currentMaximizedId) {
            container.classList.add("maximized-mode");
        } else {
            container.classList.remove("maximized-mode");
        }
    }

    // 5. Rafraîchissements secondaires
    try {
        if (typeof checkFavorisState === "function") checkFavorisState();
        if (typeof rebuildBookmarksBar === "function") rebuildBookmarksBar();
        if (typeof updateCloseButtonState === "function") updateCloseButtonState();
    } catch (err) {
        console.error("Erreur d'état d'interface secondaire :", err);
    }
});

let adBlockExceptions = new Set();

function getAdBlockHost(value) {
    try {
        const url = new URL(value);
        if (url.protocol !== "http:" && url.protocol !== "https:") return "";
        return url.hostname.toLowerCase().replace(/\.$/, "").replace(/^www\./, "");
    } catch {
        return "";
    }
}

function isAdBlockHostExcepted(hostname) {
    return Array.from(adBlockExceptions).some((exception) =>
        hostname === exception || hostname.endsWith(`.${exception}`)
    );
}

function updateAdblockButtons() {
    document.querySelectorAll(".adblock-toggle").forEach((button) => {
        const host = button.dataset.host || "";
        const isExcepted = host && isAdBlockHostExcepted(host);
        button.style.color = isExcepted ? "#16a34a" : (applicationDarkMode ? "#cfcfcf" : "#4b5563");
        button.style.background = isExcepted
            ? (applicationDarkMode ? "#16351f" : "#dcfce7")
            : "transparent";
        button.title = isExcepted
            ? `Réactiver le bloqueur sur ${host}`
            : `Désactiver le bloqueur sur ${host}`;
        button.setAttribute("aria-label", button.title);
    });
}

function updateReaderModeButtons() {
    const isReaderActive = (panelId) =>
        currentPanels.some((panel) => panel.id === panelId && panel.readerModeActive === true);
    const applyState = (button, active, isToolbarButton = false) => {
        if (!button) return;
        button.setAttribute("aria-pressed", active ? "true" : "false");
        button.dataset.active = active ? "true" : "false";
        button.style.backgroundColor = active ? "#2563eb" : (isToolbarButton ? "#2d2d30" : "transparent");
        button.style.color = active ? "#ffffff" : (isToolbarButton ? "#cfcfcf" : (applicationDarkMode ? "#cfcfcf" : "#475569"));
        button.style.borderColor = active ? "#93c5fd" : (isToolbarButton ? "#3c3c3c" : "transparent");
        button.title = active
            ? "Mode lecture activé — cliquer pour revenir à la page"
            : "Mode lecture désactivé — cliquer pour lire sans distractions";
    };

    currentPanels.forEach((panel) => {
        applyState(document.getElementById(`reader-${panel.id}`), isReaderActive(panel.id));
    });
    applyState(document.getElementById("reader-mode-button"), isReaderActive(activePanel), true);

// Signale brièvement un échec du mode lecture sur les boutons concernés.
function flashReaderResult(panelId, status) {
    if (status !== "empty" && status !== "unavailable" && status !== "error") return;
    const message = status === "empty"
        ? "Pas assez de texte à afficher en mode lecture sur cette page"
        : "Mode lecture indisponible sur cette page";
    [document.getElementById(`reader-${panelId}`), document.getElementById("reader-mode-button")].forEach((button) => {
        if (!button || button.dataset.flashing) return;
        const label = button.textContent;
        const title = button.title;
        button.dataset.flashing = "1";
        button.textContent = "⚠️";
        button.title = message;
        setTimeout(() => {
            button.textContent = label;
            button.title = title;
            delete button.dataset.flashing;
        }, 2500);
    });
}

window.api.onReaderModeResult?.(({ panelId, status }) => flashReaderResult(panelId, status));

const findBar = document.getElementById("find-in-page-bar");
const findInput = document.getElementById("find-in-page-input");
const findCount = document.getElementById("find-in-page-count");
let findPanelId = null;
let findDebounceTimer = null;
let lastFindText = "";

function requestFindInPage(action = "start") {
    const panelId = findPanelId || activePanel;
    if (!panelId || !findInput || !window.api.findInPage) return;
    findPanelId = panelId;
    const text = findInput.value.trim();
    if ((action === "next" || action === "previous") && text !== lastFindText) {
        action = "start";
    }
    lastFindText = text;
    window.api.findInPage(panelId, text, action).catch((error) => {
        console.error("Erreur de recherche dans la page :", error);
        if (findCount) findCount.textContent = "Erreur";
    });
}

function openFindBar(panelId = activePanel) {
    if (!panelId || !findBar || !findInput) return;
    findPanelId = panelId;
    findBar.classList.add("open");
    findInput.focus({ preventScroll: true });
    findInput.select();
    if (findInput.value.trim()) requestFindInPage("start");
}

function closeFindBar() {
    if (findDebounceTimer) clearTimeout(findDebounceTimer);
    findDebounceTimer = null;
    const panelIdToRestore = findPanelId;
    if (panelIdToRestore && window.api.findInPage) {
        window.api.findInPage(panelIdToRestore, "", "stop").catch(() => {});
    }
    findBar?.classList.remove("open");
    if (findCount) findCount.textContent = "0/0";
    findPanelId = null;
    if (panelIdToRestore && window.api.findInPage) {
        window.api.findInPage(panelIdToRestore, "", "focus").catch(() => {});
    }
}

findInput?.addEventListener("input", () => {
    if (findDebounceTimer) clearTimeout(findDebounceTimer);
    if (findCount) findCount.textContent = findInput.value.trim() ? "…" : "0/0";
    findDebounceTimer = setTimeout(() => {
        findDebounceTimer = null;
        requestFindInPage("start");
    }, 120);
});

findInput?.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        event.preventDefault();
        if (findDebounceTimer) clearTimeout(findDebounceTimer);
        findDebounceTimer = null;
        requestFindInPage(event.shiftKey ? "previous" : "next");
    } else if (event.key === "Escape") {
        event.preventDefault();
        closeFindBar();
    }
});

document.getElementById("find-in-page-previous")?.addEventListener("click", () => {
    requestFindInPage("previous");
    findInput?.focus({ preventScroll: true });
});
document.getElementById("find-in-page-next")?.addEventListener("click", () => {

    findInput?.focus({ preventScroll: true });
});

        input.select();
    } else if (input?.readOnly && document.activeElement === input) {
        input.blur();
    }

    const frame = document.getElementById("active-panel-frame");
    if (frame && data.bounds) {
        frame.style.display = "block";
        frame.style.left = data.bounds.x + "px";
        frame.style.top = data.bounds.y + "px";
        frame.style.width = data.bounds.width + "px";
        frame.style.height = data.bounds.height + "px";
    }
    
    const state = navigationStates[data.id] || { canGoBack: false, canGoForward: false };
    if (typeof updateToolbarButtons === "function") {
        updateToolbarButtons(state.canGoBack, state.canGoForward);
    }
    if (typeof updateCloseButtonState === "function") {
        updateCloseButtonState();
    }
});

function updateMaximizedTabDisplay(maximizedPanelId) {
    const container = document.getElementById("url-bar");
    if (!container) return;

    const tabs = container.children;

    for (const tab of tabs) {

        const input = tab.querySelector("input");
        if (!input) continue;

        const panelId = input.id.replace("-url", "");

        if (maximizedPanelId) {
            if (panelId === maximizedPanelId) {
                tab.style.display = "flex";
                tab.style.flex = "1";
            } else {
                tab.style.display = "none";
            }
        } else {
            tab.style.display = "flex";
            tab.style.flex = "1";
        }
    }
}

window.api.onZoomChanged((maximizedPanelId) => {
    currentMaximizedId = maximizedPanelId;
    updateMaximizedTabDisplay(maximizedPanelId);

    const container = document.getElementById("url-bar");
    if (!container) return;

    // Ciblage de toutes les icônes de la barre d'outils à griser en mode zoom
    const btnPrivate = document.getElementById("split-private-vertical");
    const btnVertical = document.getElementById("split-vertical");
    const btnHorizontal = document.getElementById("split-horizontal");
    const btnSave = document.getElementById("save-config-btn");
    const btnLoad = document.getElementById("load-config-btn");
    
    if (maximizedPanelId) {
        container.classList.add("maximized-mode");
        
        // Mode Zoom actif : On grise et désactive toutes les actions d'agencement et config
        [btnPrivate, btnVertical, btnHorizontal, btnSave, btnLoad].forEach(btn => {
            if (btn) {
                btn.disabled = true;
                btn.style.opacity = "0.4";
                btn.style.cursor = "not-allowed";
                // On évite d'accumuler le texte d'avertissement s'il est déjà présent
                if (!btn.title.includes("(Désactivé")) {
                    btn.title = btn.title + " (Désactivé en mode Zoom)";
                }
            }
        });
    } else {
        container.classList.remove("maximized-mode");
        
        // Mode Mosaïque normal : On réactive tous les boutons avec leur titre d'origine
        if (btnPrivate) {
            btnPrivate.disabled = false;
            btnPrivate.style.opacity = "1";
            btnPrivate.style.cursor = "pointer";
            btnPrivate.title = "Ouvrir une tuile privée à droite (Ctrl+Shift+N)";
        }
        if (btnVertical) {
            btnVertical.disabled = false;
            btnVertical.style.opacity = "1";
            btnVertical.style.cursor = "pointer";
            btnVertical.title = "Scinder à droite (Ctrl+T)";
        }
        if (btnHorizontal) {
            btnHorizontal.disabled = false;
            btnHorizontal.style.opacity = "1";
            btnHorizontal.style.cursor = "pointer";
            btnHorizontal.title = "Scinder vers le bas (Ctrl+H)";
        }
        if (btnSave) {
            btnSave.disabled = false;
            btnSave.style.opacity = "1";
            btnSave.style.cursor = "pointer";
            btnSave.title = "Sauver la configuration des panneaux (Ctrl+S)";
        }
        if (btnLoad) {
            btnLoad.disabled = false;
            btnLoad.style.opacity = "1";
            btnLoad.style.cursor = "pointer";
            btnLoad.title = "Charger une configuration des panneaux (Ctrl+O)";
        }
    }
});

const historySidebar = document.getElementById("history-sidebar");
const historyContainer = document.getElementById("history-list-container");

// 1. Fonction pour ouvrir/fermer le volet
function toggleHistorySidebar() {
    if (!historySidebar) return;
    historySidebar.classList.toggle("open");

    if (historySidebar.classList.contains("open")) {
        renderHistory();
    }
}
async function renderHistory(historyList) {
    if (!window.api.getHistory) {
        console.error("L'API getHistory n'est pas définie dans preload.js");
        return;
    }

    if (!historyList) {
        historyList = await window.api.getHistory() || [];
    }
    
    historyContainer.innerHTML = "";
    
    if (historyList.length === 0) {
        historyContainer.innerHTML = '<span style="color: #6b7280; font-size: 11px; padding: 8px; display: block;">Aucun historique disponible.</span>';
        return;
    }
    
    historyList.forEach((item, index) => {
        // Conteneur principal de la ligne
        const div = document.createElement("div");
        div.className = "history-item";
        div.style.display = "flex";
        div.style.justify = "space-between";
        div.style.alignItems = "center";
        
        // Texte du lien
        const textSpan = document.createElement("span");
        textSpan.innerText = item.title || item.url;
        textSpan.title = `${item.title}\n${item.url}`;
        textSpan.style.overflow = "hidden";
        textSpan.style.textOverflow = "ellipsis";
        textSpan.style.flex = "1";
        
        textSpan.addEventListener("click", () => {
            if (activePanel) {
                window.api.navigate(activePanel, item.url);
                toggleHistorySidebar();
            }
        });
        
        // Bouton de suppression unique
        const deleteBtn = document.createElement("span");
        deleteBtn.innerHTML = "&#10006;"; // Code pour l'icône X
        deleteBtn.style.color = "#ef4444";
        deleteBtn.style.cursor = "pointer";
        deleteBtn.style.marginLeft = "8px";
        deleteBtn.style.padding = "2px 4px";
        deleteBtn.title = "Supprimer cet élément";
        
        deleteBtn.addEventListener("click", async (e) => {
            e.stopPropagation(); // Évite de déclencher le clic de navigation
            if (window.api.deleteHistoryItem) {
                const updated = await window.api.deleteHistoryItem(index);
                renderHistory(updated);
            }
        });
        
        div.appendChild(textSpan);
        div.appendChild(deleteBtn);
        historyContainer.appendChild(div);
    });
}

let fullscreenToolbarHideTimer = null;
let fullscreenToolbarIsActive = false;

function requestFullscreenToolbar(visible) {
    if (!fullscreenToolbarIsActive) return;
    if (fullscreenToolbarHideTimer) {
        clearTimeout(fullscreenToolbarHideTimer);
        fullscreenToolbarHideTimer = null;
    }
    window.api.requestFullscreenToolbar(visible);
}

function scheduleFullscreenToolbarHide() {
    if (!fullscreenToolbarIsActive) return;
    if (fullscreenToolbarHideTimer) clearTimeout(fullscreenToolbarHideTimer);

    fullscreenToolbarHideTimer = setTimeout(() => {
        const toolbarHovered = document.querySelector("#toolbar-buttons:hover, #url-bar:hover, #find-in-page-bar:hover");
        if (toolbarHovered) {
            scheduleFullscreenToolbarHide();
            return;
        }
        window.api.requestFullscreenToolbar(false);
        fullscreenToolbarHideTimer = null;
    }, 1400);
}

window.api.onFullscreenToolbarState((state) => {
    fullscreenToolbarIsActive = !!state?.fullscreen;
    document.body.classList.toggle("fullscreen-toolbar-hidden", fullscreenToolbarIsActive && !state.visible);
    document.body.classList.toggle("fullscreen-toolbar-active", fullscreenToolbarIsActive && !!state.visible);

    if (fullscreenToolbarHideTimer) {
        clearTimeout(fullscreenToolbarHideTimer);
        fullscreenToolbarHideTimer = null;
    }
});

const fullscreenRevealZone = document.getElementById("fullscreen-reveal-zone");
fullscreenRevealZone?.addEventListener("mouseenter", () => requestFullscreenToolbar(true));
fullscreenRevealZone?.addEventListener("mouseleave", scheduleFullscreenToolbarHide);

[document.getElementById("toolbar-buttons"), document.getElementById("url-bar"), document.getElementById("find-in-page-bar")].forEach((bar) => {
    bar?.addEventListener("mouseenter", () => {
        if (fullscreenToolbarHideTimer) clearTimeout(fullscreenToolbarHideTimer);
        fullscreenToolbarHideTimer = null;
    });
    bar?.addEventListener("mouseleave", scheduleFullscreenToolbarHide);
});

// Fonction centrale pour restaurer l'état nominal VERT du bouton

// Interception des signaux de chargement globaux (main.js)

    isAiRequestRunning = isLoading;
    
    if (isLoading) {
        if (summaryBtn) {
            summaryBtn.innerHTML = "🛑 Stop";
            summaryBtn.style.background = "#ef4444"; // Rouge Stop
            summaryBtn.style.color = "white";

});

// ÉCOUTEUR DE CLIC UNIQUE SUR LE BOUTON MIXTE (DISJONCTEUR RE-SYNCHRONISÉ)
if (summaryBtn) {
    // On supprime l'ancien comportement en forçant un stop de propagation prioritaire
    summaryBtn.addEventListener("click", async (event) => {
        event.preventDefault();
        event.stopImmediatePropagation(); // Coupe les scripts parasites de index.html

        if (isAiRequestRunning) {
            // 🚨 ACTION A : L'IA TOURNE -> LE BOUTON AGIT EN STOP NET
            console.log("[Disjoncteur] Clic sur Stop : Interruption demandée.");
            
            // 1. Coupe immédiatement le réseau côté main.js
            window.api.cancelAiRequest(); 
            
            // 2. Réinitialise l'IHM locale immédiatement
            restaurerBoutonVertOrigine();
        } else {
            // 📝 ACTION B : L'IA EST INACTIVE -> ON LANCE L'ANALYSE
            console.log("[Interface] Lancement du résumé...");
            
            // On passe manuellement l'IHM en mode chargement pour éviter les latences
            isAiRequestRunning = true;
            summaryBtn.innerHTML = "🛑 Stop";
            summaryBtn.style.background = "#ef4444";
            
            try {
                // Utilisation de la passerelle directe exposée dans votre preload.js (Ligne 128)
                const promptFixe = "Fais-moi un résumé concis des 3 points clés de cet article.";
                const response = await window.api.nanobrowser.askOllama(promptFixe, undefined, false, true);
                
                // Injection du résultat dans le conteneur si la fonction d'affichage globale ne l'a pas fait
                const container = document.getElementById("ai-response-container");
                if (container && response) {
                    // Si la réponse n'est pas une notification d'erreur ou d'annulation
                    if (!response.includes("Annulé par l'utilisateur")) {
                        container.innerHTML = `<div class="ai-message">${response}</div>`;
                    }
                }
            } catch (err) {
                console.error("[Assistant IA] Erreur lors de la génération :", err);
            } finally {
                // On restaure le bouton vert à la fin de l'exécution
                restaurerBoutonVertOrigine();
            }
        }
    }, true); // Le paramètre 'true' (phase de capture) intercepte le clic avant le script masqué
}

async function refreshPasswordList() {

    if (list.length === 0) {

// Rendu minimal et sûr (HTML échappé) : tableaux Markdown, gras et retours à la ligne.
function renderAiMarkdown(markdown) {
    const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const inline = (s) => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const isTableLine = (l) => l.trim().startsWith("|");
    const isSeparator = (l) => /^\|?[\s:|-]+\|?$/.test(l.trim()) && l.includes("-");
    const splitCells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());

    const lines = String(markdown).split("\n");
    let html = "";
    let textBuffer = [];
    const flushText = () => {
        if (textBuffer.length) html += `<div style="white-space:pre-wrap;margin:6px 0;">${inline(textBuffer.join("\n").trim())}</div>`;
        textBuffer = [];
    };

    for (let i = 0; i < lines.length;) {
        if (!isTableLine(lines[i])) { textBuffer.push(lines[i++]); continue; }
        flushText();
        const rows = [];
        while (i < lines.length && isTableLine(lines[i])) {
            if (!isSeparator(lines[i])) rows.push(splitCells(lines[i]));
            i++;
        }
        const cellStyle = "border:1px solid #3c3c3c;padding:4px 6px;text-align:left;vertical-align:top;word-break:normal;overflow-wrap:break-word;min-width:48px;";
        html += '<div style="overflow-x:auto;margin:8px 0;"><table style="border-collapse:collapse;width:100%;font-size:11px;white-space:normal;">';
        rows.forEach((cells, rowIndex) => {
            const tag = rowIndex === 0 ? "th" : "td";
            const bg = rowIndex === 0 ? "background:#2d2d30;" : "";
            html += "<tr>" + cells.map((c) => `<${tag} style="${cellStyle}${bg}">${inline(c)}</${tag}>`).join("") + "</tr>";
        });
        html += "</table></div>";
    }
    flushText();
    return html;
}

async function envoyerRequeteIA(questionUser, isSummary = false, isQuestion = false, compareVisiblePanels = false) {
    const modeleChoisi = "qwen2.5:1.5b";
    const aiSidebar = document.getElementById("ai-sidebar");
    const loadingBtn = isSummary
        ? document.getElementById("ai-summary-btn")
        : isQuestion
            ? document.getElementById("ai-submit-btn")
            : compareVisiblePanels ? document.getElementById("ai-compare-panels-btn") : null;
    const originalButtonHtml = loadingBtn ? loadingBtn.innerHTML : "";
    
    // Pré-élargit le volet pour afficher le tableau
    if (compareVisiblePanels) window.api.setAiSidebarWide(true);

    // Force l'ouverture visuelle immédiate du volet
    if (aiSidebar) aiSidebar.style.right = "0px";

    if (loadingBtn) {
        loadingBtn.disabled = true;
        loadingBtn.classList.add("btn-analyzing");
        loadingBtn.innerHTML = '<span class="hourglass-anim">⏳</span> Analyse...';
    }
    
    // Affiche le message d'attente à l'utilisateur
    aiResponseContainer.innerHTML = compareVisiblePanels
        ? '<span style="color: #a1a1aa; font-style: italic; font-size: 12px;"><span class="hourglass-anim">⏳</span> L\'IA analyse les tuiles visibles pour préparer la comparaison...</span>'
        : '<span style="color: #a1a1aa; font-size: 12px;"><span class="hourglass-anim">⏳</span> L\'IA analyse le contenu de la tuile active...</span>';
    
    console.log("[IHM DIAGNOSTIC] Envoi de la demande d'IA au processus principal pour :", questionUser);
    
    try {
        // Utilise l'API exposée par le preload pour appeler le gestionnaire IPC Ollama.
        const reponse = await window.api.nanobrowser.askOllama(questionUser, modeleChoisi, compareVisiblePanels, document.getElementById("ai-full-mode")?.checked === true);
        
        console.log("[IHM DIAGNOSTIC] Réponse reçue du processus principal :", reponse);

        if (reponse && reponse.trim() === "SELECT_PANEL_REQUIRED") {
            aiResponseContainer.innerHTML = `
                <div style="line-height: 1.6; text-align: left;">
                <div class="ai-alert-badge" style="display: flex; flex-direction: row; align-items: center; justify-content: center; height: 38px; line-height: 38px; margin-bottom: 16px; border-radius: 6px; font-weight: 600; font-size: 12.5px; box-sizing: border-box; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171;">
                    <span style="display: inline-flex; align-items: center; justify-content: center; height: 100%; line-height: 1;">⚠️ Action impossible</span>
                </div>
                <span style="font-size: 12px;">Veuillez d'abord activer une tuile web avant de lancer l'analyse.</span>
                </div>
            `;
            return;
        }
        
        if (reponse) {
            const hasTable = /^\s*\|.+\|\s*$/m.test(reponse);
            window.api.setAiSidebarWide(hasTable);
            aiResponseContainer.innerHTML = renderAiMarkdown(reponse);
        } else {
            aiResponseContainer.innerHTML = '<span style="color: #f87171; font-size: 12px;">❌ L\'IA a renvoyé une réponse vide.</span>';
        }
        
        } catch (error) {
            console.error("Erreur IHM Assistant :", error);
            if (aiResponseContainer) {
                aiResponseContainer.innerHTML = `<span style="color: #f87171; font-size: 12px;">❌ Impossible de joindre le pont IPC (${error.message})</span>`;
            }
        } finally {
            if (loadingBtn) {
                loadingBtn.disabled = false;
                loadingBtn.classList.remove("btn-analyzing");
                loadingBtn.innerHTML = originalButtonHtml;
            }
        }
}
