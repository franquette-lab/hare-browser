<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title data-i18n="passwords.windowTitle">🔑 Gestionnaire de mots de passe sécurisés</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 14px; user-select: none;
            background: #ffffff; color: #1f2937;
            transition: background 0.2s, color 0.2s;
        }
        body.dark { background: #2d2d30; color: #cfcfcf; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px; margin-bottom: 12px; }
        .dark .header { border-color: #3c3c3c; }
        h3 { margin: 0; font-size: 13px; font-weight: bold; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        input { padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; background: transparent; color: inherit; font-size: 11px; outline: none; }
        .dark input { border-color: #3c3c3c; background: #1e1e1e; }
        input:focus { border-color: #2563eb; }
        
        button.save { background: #2563eb; color: white; border: none; border-radius: 4px; padding: 7px; cursor: pointer; font-weight: bold; font-size: 11px; }
        button.save:hover { background: #1d4ed8; }
        
        .list-container { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .entry-item { display: flex; justify-content: space-between; align-items: center; background: #f3f4f6; padding: 6px; border-radius: 4px; border: 1px solid #e5e7eb; font-size: 11px; }
        .dark .entry-item { background: #1e1e1e; border-color: #3c3c3c; }
        
        button.del { background: #ef4444; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.del:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="header">
        <h3 id="title">🔑 Mots de passe enregistrés</h3>
    </div>
    
    <div class="form-group">
        <input type="text" id="url" placeholder="Site web (ex: github.com)">
        <input type="text" id="user" placeholder="Identifiant / Adresse e-mail">
        <input type="password" id="pass" placeholder="Mot de passe secret">
        <button class="save" onclick="saveNewPassword()">Enregistrer le compte</button>
    </div>

    <div class="list-container" id="list"></div>

    <script src="i18n.js"></script>
    <script>HareI18n.attach(window.passwordApi);</script>
    <script>
        // Dans passwords.html -> Dans la balise <script>, localisez 'render-passwords'

        window.passwordApi.onRenderPasswords((data) => {
            // Force l'application ou le retrait de la classe CSS .dark sur la balise body
            if (data.isDarkMode) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
            
            const container = document.getElementById('list');
            container.innerHTML = '';

            if (data.list.length === 0) {
                container.innerHTML = '<span style="color:#6b7280; font-style:italic; text-align:center; padding:10px 0; display:block; font-size:11px;">Aucun mot de passe enregistré.</span>';
                return;
            }

            data.list.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'entry-item';
                div.innerHTML = `
                    <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; padding-right:6px;">
                        <strong style="color:#2563eb;">${item.url}</strong><br>
                        <span style="color:#6b7280; font-size:10px;">${item.username}</span>
                    </div>
                    <button class="del" onclick="deletePassword(${index})">×</button>
                `;
                container.appendChild(div);
            });
        });

        function saveNewPassword() {
            const url = document.getElementById('url').value.trim();
            const username = document.getElementById('user').value.trim();
            const password = document.getElementById('pass').value.trim();

            if (url && username && password) {
                window.passwordApi.savePassword({ url, username, password });
                document.getElementById('url').value = '';
                document.getElementById('user').value = '';
                document.getElementById('pass').value = '';
            }
        }

        function deletePassword(index) {
            window.passwordApi.deletePassword(index);
        }
    </script>
</body>
</html>
