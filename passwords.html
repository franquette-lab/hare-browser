<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gestionnaire de mots de passe</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --item-bg: #f9fafb;
            --accent-color: #2563eb;
            --danger-color: #dc2626;
            --input-bg: #ffffff;
        }
        html.mw-theme-client-dark {
            --bg-color: #2d2d30;
            --text-color: #cfcfcf;
            --border-color: #3c3c3c;
            --item-bg: #1e1e1e;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --input-bg: #2d2d30;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            user-select: none;
        }
        h2 { font-size: 14px; margin-top: 0; margin-bottom: 16px; font-weight: 600; }
        .password-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 340px;
            overflow-y: auto;
        }
        .password-item {
            background-color: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }
        .site-url { font-weight: bold; font-size: 13px; color: var(--accent-color); word-break: break-all; padding-right: 24px; }
        .username { font-size: 12px; opacity: 0.8; }
        
        /* ✨ CORRECTIF GEOMETRIE : Force une ligne stable et visible */
        .password-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            width: 100%;
        }
        /* ✨ FIX DESIGN : Donne une boîte réelle à l'input pour éviter le 0px */
        .password-value {
            font-family: monospace;
            font-size: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            flex-grow: 1;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 120px;
            box-sizing: border-box;
        }
        .password-value:focus { outline: none; border-color: var(--accent-color); }
        
        .btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-toggle {
            background-color: var(--border-color);
            color: var(--text-color);
            height: 26px;
            width: 32px;
        }
        .btn-delete {
            position: absolute;
            top: 12px;
            right: 12px;
            color: var(--danger-color);
            padding: 4px;
            line-height: 1;
        }
        .btn-delete:hover { background-color: rgba(220, 38, 38, 0.1); }
        .empty-state { text-align: center; font-size: 13px; opacity: 0.6; padding: 40px 0; }
    </style>
</head>
<body>
    <h2 id="title-label">🔑 Mots de passe enregistrés</h2>
    <div id="container" class="password-list"></div>

    <script src="tooltip-glass.js"></script>
    <script>
        const container = document.getElementById('container');
        let currentVault = [];

        function renderList(data) {
            if (!data) return;
            container.innerHTML = '';
            currentVault = data.list || [];
            
            if (data.isDarkMode) {
                document.documentElement.classList.add('mw-theme-client-dark');
            } else {
                document.documentElement.classList.remove('mw-theme-client-dark');
            }

            if (currentVault.length === 0) {
                container.innerHTML = `<div class="empty-state">Aucun mot de passe enregistré.</div>`;
                return;
            }

            currentVault.forEach((entry, index) => {
                if (!entry) return;

                const item = document.createElement('div');
                item.className = 'password-item';
                
                const urlEl = document.createElement('span');
                urlEl.className = 'site-url';
                urlEl.textContent = entry.url || 'Inconnu';
                item.appendChild(urlEl);

                const userEl = document.createElement('span');
                userEl.className = 'username';
                userEl.textContent = `Identifiant : ${entry.username || ''}`;
                item.appendChild(userEl);

                const row = document.createElement('div');
                row.className = 'password-row';

                const passInput = document.createElement('input');
                passInput.type = 'password';
                passInput.className = 'password-value';
                passInput.value = entry.password || '';
                passInput.setAttribute('readonly', 'readonly'); 
                row.appendChild(passInput);

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'btn btn-toggle';
                toggleBtn.textContent = '👁️';
                toggleBtn.title = "Afficher / Masquer";
                
                toggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (passInput.type === 'password') {
                        passInput.type = 'text';
                        toggleBtn.textContent = '🔒';
                    } else {
                        passInput.type = 'password';
                        toggleBtn.textContent = '👁️';
                    }
                });
                
                row.appendChild(toggleBtn);
                item.appendChild(row);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-delete';
                deleteBtn.textContent = '🗑️';
                deleteBtn.addEventListener('click', () => {
                    if (confirm(`Supprimer les identifiants pour ${entry.username} ?`)) {
                        window.passwordApi.deletePassword(index);
                    }
                });
                item.appendChild(deleteBtn);

                container.appendChild(item);
            });
        }

        // Connexion et initialisation asynchrone sécurisée
        if (window.passwordApi && typeof window.passwordApi.onRenderPasswords === 'function') {
            window.passwordApi.onRenderPasswords((data) => {
                renderList(data);
            });
            
            if (typeof window.passwordApi.savePassword === 'function') {
                window.passwordApi.savePassword({ url: "INTERNAL_PING_REFRESH", username: "", password: "" });
            }
        }
    </script>
</body>
</html>
