<html>
<!-- ====== history.html ====== -->
<head>
    <meta charset="utf-8">
    <style>

/* =====================================================
   PERSONNALISATION DYNAMIQUE DE LA SCROLLBAR
===================================================== */

/* 1. Largeur de la barre verticale */
::-webkit-scrollbar {
    width: 10px;
}

/* 2. Fond de la barre (Track) - Géré dynamiquement par des variables CSS */
::-webkit-scrollbar-track {
    background: var(--scrollbar-track, #f3f4f6);
}

/* 3. Curseur mobile (Thumb) */
::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb, #d1d5db);
    border-radius: 4px;
    border: 2px solid var(--scrollbar-track, #f3f4f6); /* Crée une jolie marge interne */
}

/* 4. Effet au survol du curseur */
::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-thumb-hover, #9ca3af);
}


        body { 
            color-scheme: light dark;
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 12px; user-select: none;
        }

.header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    border-bottom: 1px solid #4b5563; 
    padding-bottom: 8px; 
    margin-bottom: 12px; 
    
    /* Fixe l'en-tête en haut */
    position: sticky;
    top: 0;
    z-index: 100; 
    background: inherit; 
    padding-top: 4px; 
}

h2 { 
    margin: 0; 
    font-size: 14px; /* TAILLE CORRIGÉE : Plus petite et proportionnelle */
    font-weight: bold; 
    display: flex;
    align-items: center;
    gap: 6px; /* Espace équilibré entre le parchemin et le texte */
}
            
        .clear-all-btn { font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s ease; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; transition: background 0.2s; border-radius: 4px; }
        .content { flex: 1; cursor: pointer; overflow: hidden; padding-right: 8px; }
        .title { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .url { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
        .delete-btn { cursor: pointer; padding: 2px 6px; font-size: 13px; font-weight: bold; border-radius: 4px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
        #empty { color: #6b7280; font-size: 12px; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="history-title">📜 Historique de navigation</h2>
        <div id="clear-container"></div>
    </div>
    <div id="history-container"></div>


<!-- ====== DANS HISTORY.HTML ====== -->


<!-- ====== DANS HISTORY.HTML ====== -->
<script>



// On utilise l'API sécurisée exposée par le script preload-history.js
window.historyApi.onRenderHistory((data) => {
    const container = document.getElementById('history-container');
    const clearContainer = document.getElementById('clear-container');
    const isDark = data.isDarkMode;
    
    // Application globale des thèmes (Lignes déjà existantes dans votre code)
    document.body.style.background = isDark ? "#1e1e1e" : "#f9fafb";
    document.body.style.color = isDark ? "#cfcfcf" : "#1f2937";
    document.getElementById('history-title').style.color = isDark ? "#ffffff" : "#000000";

    const headerElement = document.querySelector('.header');
    headerElement.style.borderColor = isDark ? "#3c3c3c" : "#e5e7eb";

    // SÉCURITÉ COMPLÉMENTAIRE : Force le fond opaque sur l'en-tête fixe
    headerElement.style.background = isDark ? "#1e1e1e" : "#f9fafb";

    // INJECTION DES COULEURS DE LA BARRE DE DÉFILEMENT SELON LE MODE
    if (isDark) {
        document.documentElement.style.setProperty('--scrollbar-track', '#1e1e1e');
        document.documentElement.style.setProperty('--scrollbar-thumb', '#374151');
        document.documentElement.style.setProperty('--scrollbar-thumb-hover', '#4b5563');
    } else {
        document.documentElement.style.setProperty('--scrollbar-track', '#f9fafb'); // Fond blanc/gris très clair
        document.documentElement.style.setProperty('--scrollbar-thumb', '#cbd5e1'); // Curseur gris clair
        document.documentElement.style.setProperty('--scrollbar-thumb-hover', '#94a3b8'); // Curseur au survol
    }

    clearContainer.innerHTML = '';
    container.innerHTML = '';

        // Gestion du bouton Effacer tout
        if (data.historyList.length > 0) {
            const clearBtn = document.createElement('button');
            clearBtn.className = 'clear-all-btn';
            clearBtn.innerText = 'Effacer tout';
            
            // Couleurs adaptatives pour le bouton selon le mode
            clearBtn.style.background = isDark ? "#374151" : "#ffffff";
            clearBtn.style.color = isDark ? "#9ca3af" : "#4b5563";
            clearBtn.style.border = `1px solid ${isDark ? "#4b5563" : "#d1d5db"}`;
            
            clearBtn.onclick = () => window.historyApi.clearAllHistory();
            clearBtn.onmouseenter = () => {
                clearBtn.style.background = isDark ? "#991b1b" : "#fee2e2";
                clearBtn.style.color = isDark ? "#fca5a5" : "#b91c1c";
            };
            clearBtn.onmouseleave = () => {
                clearBtn.style.background = isDark ? "#374151" : "#ffffff";
                clearBtn.style.color = isDark ? "#9ca3af" : "#4b5563";
            };
            clearContainer.appendChild(clearBtn);

            // Remplissage de l'historique
            data.historyList.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.style.borderBottom = `1px solid ${isDark ? "#2d2d30" : "#f3f4f6"}`;
                div.onmouseenter = () => div.style.background = isDark ? "#2d2d30" : "#f3f4f6";
                div.onmouseleave = () => div.style.background = "transparent";

                div.innerHTML = `
                    <div class="content">
                        <div class="title" style="color: ${isDark ? '#ffffff' : '#1f2937'}">${item.title || item.url}</div>
                        <div class="url" style="color: #6b7280">${item.url}</div>
                    </div>
                    <div class="delete-btn" style="color: ${isDark ? '#6b7280' : '#9ca3af'}">×</div>
                `;

                div.querySelector('.content').onclick = () => window.historyApi.historyClick(item.url);
                
                const delBtn = div.querySelector('.delete-btn');
                delBtn.onclick = () => window.historyApi.deleteSingleHistory(index);
                delBtn.onmouseenter = () => {
                    delBtn.style.background = isDark ? "#991b1b" : "#fee2e2";
                    delBtn.style.color = isDark ? "#fca5a5" : "#b91c1c";
                };
                delBtn.onmouseleave = () => {
                    delBtn.style.background = "transparent";
                    delBtn.style.color = isDark ? '#6b7280' : '#9ca3af';
                };

                container.appendChild(div);
            });
        } else {
            container.innerHTML = '<div id="empty">Aucun historique disponible.</div>';
        }
    });



    
</script>



</body>
</html>
